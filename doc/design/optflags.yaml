cspath: rpmrc

# keep in sync with %__global_compiler_flags in
# - https://gitee.com/openeuler/openEuler-rpm-config/blob/master/macros
# - https://gitee.com/openeuler/openEuler-rpm-config/blob/master/rpmrc
__global_compiler_flags: -O2 -g -pipe -Wall -Werror=format-security -Wp,-D_FORTIFY_SOURCE=2 -Wp,-D_GLIBCXX_ASSERTIONS -fasynchronous-unwind-tables -fstack-clash-protection -fstack-protector-strong -grecord-gcc-switches %{_hardened_cflags}

arch_optflags when architecture=i686:		-O2 -m32 -march=i686 -mtune=generic -msse2 -mfpmath=sse -mstackrealign
arch_optflags when architecture=athlon:		-O2 -m32 -march=athlon
arch_optflags when architecture=x86_64:		-O2 -m64 -mtune=generic
arch_optflags when architecture=aarch64:	-O2
arch_optflags when architecture=riscv64:	-O2
arch_optflags when architecture=fat:		-O2 -arch i386 -arch ppc
arch_optflags when architecture=i386:		-O2 -march=i386 -mtune=i686
arch_optflags when architecture=i486:		-O2 -march=i486
arch_optflags when architecture=i586:		-O2 -march=i586
arch_optflags when architecture=pentium3:	-O2 -march=pentium3
arch_optflags when architecture=pentium4:	-O2 -march=pentium4
arch_optflags when architecture=geode:		-Os -m32 -march=geode
arch_optflags when architecture=ia64:		-O2
arch_optflags when architecture=amd64:		-O2
arch_optflags when architecture=ia32e:		-O2
arch_optflags when architecture=alpha:		-O2 -mieee
arch_optflags when architecture=alphaev5:	-O2 -mieee -mtune=ev5
arch_optflags when architecture=alphaev56:	-O2 -mieee -mtune=ev56
arch_optflags when architecture=alphapca56:	-O2 -mieee -mtune=pca56
arch_optflags when architecture=alphaev6:	-O2 -mieee -mtune=ev6
arch_optflags when architecture=alphaev67:	-O2 -mieee -mtune=ev67
arch_optflags when architecture=sparc:		-O2 -m32 -mtune=ultrasparc
arch_optflags when architecture=sparcv8:	-O2 -m32 -mtune=ultrasparc -mv8
arch_optflags when architecture=sparcv9:	-O2 -m32 -mtune=ultrasparc
arch_optflags when architecture=sparcv9v:	-O2 -m32 -mtune=niagara
arch_optflags when architecture=sparc64:	-O2 -m64 -mtune=ultrasparc
arch_optflags when architecture=sparc64v:	-O2 -m64 -mtune=niagara
arch_optflags when architecture=m68k:		-O2 -fomit-frame-pointer
arch_optflags when architecture=ppc:		-O2
arch_optflags when architecture=ppc8260:	-O2
arch_optflags when architecture=ppc8560:	-O2
arch_optflags when architecture=ppc32dy4:	-O2
arch_optflags when architecture=ppciseries:	-O2
arch_optflags when architecture=ppcpseries:	-O2
arch_optflags when architecture=ppc64:		-O2
arch_optflags when architecture=ppc64le:	-O2
arch_optflags when architecture=ppc64p7:	-O3 -mtune=power7 -mcpu=power7
arch_optflags when architecture=parisc:		-O2 -mpa-risc-1-0
arch_optflags when architecture=hppa1.0:	-O2 -mpa-risc-1-0
arch_optflags when architecture=hppa1.1:	-O2 -mpa-risc-1-0
arch_optflags when architecture=hppa1.2:	-O2 -mpa-risc-1-0
arch_optflags when architecture=hppa2.0:	-O2 -mpa-risc-1-0
arch_optflags when architecture=mips:		-O2
arch_optflags when architecture=mipsel:		-O2
arch_optflags when architecture=mips64:		-O2
arch_optflags when architecture=mips64el:	-O2
arch_optflags when architecture=mipsr6:		-O2
arch_optflags when architecture=mipsr6el:	-O2
arch_optflags when architecture=mips64r6:	-O2
arch_optflags when architecture=mips64r6el:	-O2
arch_optflags when architecture=armv3l:		-O2 -march=armv3
arch_optflags when architecture=armv4b:		-O2 -march=armv4
arch_optflags when architecture=armv4l:		-O2 -march=armv4
arch_optflags when architecture=armv4tl:	-O2 -march=armv4t
arch_optflags when architecture=armv5tl:	-O2 -march=armv5t
arch_optflags when architecture=armv5tel:	-O2 -march=armv5te
arch_optflags when architecture=armv5tejl:	-O2 -march=armv5te
arch_optflags when architecture=armv6l:		-O2 -march=armv6
arch_optflags when architecture=armv6hl:	-O2 -march=armv6 -mfloat-abi=hard -mfpu=vfp
arch_optflags when architecture=armv7l:		-O2 -march=armv7
arch_optflags when architecture=armv7hl:	-O2 -march=armv7-a -mfloat-abi=hard -mfpu=vfpv3-d16
arch_optflags when architecture=armv7hnl:	-O2 -march=armv7-a -mfloat-abi=hard -mfpu=neon
arch_optflags when architecture=armv8l:		-O2 -march=armv8-a
arch_optflags when architecture=armv8hl:	-O2 -march=armv8-a -mfloat-abi=hard -mfpu=vfpv4
arch_optflags when architecture=m68k:		-O2 -fomit-frame-pointer
arch_optflags when architecture=atarist:	-O2 -fomit-frame-pointer
arch_optflags when architecture=atariste:	-O2 -fomit-frame-pointer
arch_optflags when architecture=ataritt:	-O2 -fomit-frame-pointer
arch_optflags when architecture=falcon:		-O2 -fomit-frame-pointer
arch_optflags when architecture=atariclone:	-O2 -fomit-frame-pointer
arch_optflags when architecture=milan:		-O2 -fomit-frame-pointer
arch_optflags when architecture=hades:		-O2 -fomit-frame-pointer
arch_optflags when architecture=s390:		-O2
arch_optflags when architecture=s390x:		-O2
arch_optflags when architecture=sh3:		-O2
arch_optflags when architecture=sh4:		-O2 -mieee
arch_optflags when architecture=sh4a:		-O2 -mieee
arch_optflags when architecture=aarch64_ilp32:	-O2 -mabi=ilp32
