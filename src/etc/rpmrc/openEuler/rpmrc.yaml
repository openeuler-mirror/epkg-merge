_vendor: openEuler
_os: linux
_target_platform: "${{rpmGlobal._target_cpu}}-${{rpmGlobal._vendor}}-${{rpmGlobal._target_os}}%{?_gnu}"
_localstatedir: /var
_pkgdocdir: "%{_docdir}/%{name}"
_docdir_fmt: "%%{NAME}"
_fmoddir: "${{rpmGlobal._libdir}}/gfortran/modules"
_enable_debug_packages: 1
_include_gdb_index: 1
_debugsource_packages: 1
_build_id_links: none
build_cflags: "${{rpmGlobal.optflags}}"
build_cxxflags: "${{rpmGlobal.optflags}} -fexceptions"
build_fflags: "${{rpmGlobal.optflags}} -fexceptions -I${{rpmGlobal._fmoddir}}"
build_ldflags: -Wl,-z,relro ${{rpmGlobal._ld_as_needed_flags}} ${{rpmGlobal._ld_symbols_flags}} ${{rpmGlobal._hardened_ldflags}}
set_build_flags: |
  CFLAGS="${CFLAGS:-%{build_cflags}}" ; export CFLAGS ; \
  CXXFLAGS="${CXXFLAGS:-%{build_cxxflags}}" ; export CXXFLAGS ; \
  FFLAGS="${FFLAGS:-%{build_fflags}}" ; export FFLAGS ; \
  FCFLAGS="${FCFLAGS:-%{build_fflags}}" ; export FCFLAGS ; \
  LDFLAGS="${LDFLAGS:-%{build_ldflags}}" ; export LDFLAGS

__global_cflags: "${{rpmGlobal.build_cflags}}"
__global_cxxflags: "${{rpmGlobal.build_cxxflags}}"
__global_fflags: "${{rpmGlobal.build_fflags}}"
__global_fcflags: "${{rpmGlobal.build_fflags}}"
__global_ldflags: "${{rpmGlobal.build_ldflags}}"
_configure_gnuconfig_hack: 1
_configure_libtool_hardening_hack: 1
_update_config_guess: |
  [ "%_configure_gnuconfig_hack" = 1 ] && for i in $(find . -name config.guess) ; do \
      [ -f /usr/lib/rpm/%{_vendor}/$(basename $i) ] && \
      %{__rm} -f $i && \
      %{__cp} -fv /usr/lib/rpm/%{_vendor}/$(basename $i) $i ; \
  done ;

_update_config_sub: |
  [ "%_configure_gnuconfig_hack" = 1 ] && for i in $(find . -name config.sub) ; do \
      [ -f /usr/lib/rpm/%{_vendor}/$(basename $i) ] && \
      %{__rm} -f $i && \
      %{__cp} -fv /usr/lib/rpm/%{_vendor}/$(basename $i) $i ; \
  done ;

configure: |
  %{set_build_flags}; \
  [ "%_configure_gnuconfig_hack" = 1 ] && for i in $(find $(dirname %{_configure}) -name config.guess -o -name config.sub) ; do \
      [ -f /usr/lib/rpm/%{_vendor}/$(basename $i) ] && %{__rm} -f $i && %{__cp} -fv /usr/lib/rpm/%{_vendor}/$(basename $i) $i ; \
  done ; \
  [ "%_configure_libtool_hardening_hack" = 1 ] && [ x != "x%{_hardened_ldflags}" ] && \
      for i in $(find . -name ltmain.sh) ; do \
        %{__sed} -i.backup -e 's~compiler_flags=$~compiler_flags="%{_hardened_ldflags}"~' $i \
      done ; \
  %{_configure} --build=%{_build} --host=%{_host} \\\
        --program-prefix=%{?_program_prefix} \\\
        --disable-dependency-tracking \\\
        %{?_configure_disable_silent_rules:--disable-silent-rules} \\\
        --prefix=%{_prefix} \\\
        --exec-prefix=%{_exec_prefix} \\\
        --bindir=%{_bindir} \\\
        --sbindir=%{_sbindir} \\\
        --sysconfdir=%{_sysconfdir} \\\
        --datadir=%{_datadir} \\\
        --includedir=%{_includedir} \\\
        --libdir=%{_libdir} \\\
        --libexecdir=%{_libexecdir} \\\
        --localstatedir=%{_localstatedir} \\\
        --sharedstatedir=%{_sharedstatedir} \\\
        --mandir=%{_mandir} \\\
        --infodir=%{_infodir}

__spec_install_pre: |
  %{___build_pre}\
  [ "$RPM_BUILD_ROOT" != "/" ] && rm -rf "${RPM_BUILD_ROOT}"\
  mkdir -p `dirname "$RPM_BUILD_ROOT"`\
  mkdir "$RPM_BUILD_ROOT"\
  %{nil}

__arch_install_post: /usr/lib/rpm/check-buildroot
__brp_chrpath: /usr/lib/rpm/brp-chrpath ${{rpmGlobal.buildroot}}
__brp_ldconfig: /usr/lib/rpm/brp-ldconfig
__brp_compress: /usr/lib/rpm/brp-compress
__brp_strip: /usr/lib/rpm/brp-strip ${{rpmGlobal.__strip}}
__brp_strip_comment_note: /usr/lib/rpm/brp-strip-comment-note ${{rpmGlobal.__strip}} ${{rpmGlobal.__objdump}}
__brp_strip_static_archive: /usr/lib/rpm/brp-strip-static-archive ${{rpmGlobal.__strip}}
__brp_python_bytecompile: /usr/lib/rpm/brp-python-bytecompile "${{rpmGlobal.__python}}" "%{?_python_bytecompile_errors_terminate_build}" "%{?_python_bytecompile_extra}"
__brp_python_hardlink: /usr/lib/rpm/brp-python-hardlink
__os_install_post: |
  %{?__brp_ldconfig} \
  %{?__brp_compress} \
  %{!?__debug_package:\
  %{?__brp_strip} \
  %{?__brp_strip_comment_note} \
  } \
  %{?__brp_strip_static_archive} \
  %{?py_auto_byte_compile:%{?__brp_python_bytecompile}} \
  %{?__brp_python_hardlink} \
  %{?openEuler_delete_rpath:%{?__brp_chrpath}} \
  %{nil}

install: |
  %{?_enable_debug_packages:%{?buildsubdir:%{debug_package}}}\
  %%install\
  %{nil}

_missing_build_ids_terminate_build: 1
py_auto_byte_compile: 1
_python_bytecompile_errors_terminate_build: 1
_python_bytecompile_extra: 1
_source_filedigest_algorithm: 8
_binary_filedigest_algorithm: 8
_binary_payload: w2.xzdio
_hardening_cflags: -specs=/usr/lib/rpm/generic-hardened-cc1
_hardening_ldflags: -Wl,-z,now -specs=/usr/lib/rpm/generic-hardened-ld
_hardened_build: 1
_hardened_cflags: "%{?_hardened_build:${{rpmGlobal._hardening_cflags}}}"
_hardened_ldflags: "%{?_hardened_build:${{rpmGlobal._hardening_ldflags}}}"
_sec_opt_build: 1
_pie_build: 1
_pie_pre_cflags: -specs=/usr/lib/rpm/generic-pie-cc1
_pie_pre_ldflags: -Wl,-z,now -specs=/usr/lib/rpm/generic-pie-ld
_pie_cflags: "%{?_sec_opt_build:?_pie_build:${{rpmGlobal._pie_pre_cflags}}}"
_pie_ldflags: "%{?_sec_opt_build:?_pie_build:${{rpmGlobal._pie_pre_ldflags}}}"
_fs_build: 1
_fs_pre_cflags: -specs=/usr/lib/rpm/generic-fs-cc1
_fs_cflags: "%{?_fs_build:${{rpmGlobal._fs_pre_cflags}}}"
_ld_symbols_flags: "%{?_ld_strict_symbol_defs:-Wl,-z,defs}"
_ld_as_needed_flags: "%{?_ld_as_needed:-Wl,--as-needed}"
__global_compiler_flags: -O2 -g -pipe -Wall -Werror=format-security -Wp,-D_FORTIFY_SOURCE=2 -Wp,-D_GLIBCXX_ASSERTIONS -fstack-protector-strong -grecord-gcc-switches ${{rpmGlobal._hardened_cflags}}
_changelog_trimtime: "%{lua:print(os.time() - 2 * 365 * 86400)}"
filter_provides_in(P): |
  %{expand: \
  %global __filter_prov_cmd %{?__filter_prov_cmd} %{__grep} -v %{-P} '%*' | \
  }

filter_requires_in(P): |
  %{expand: \
  %global __filter_req_cmd %{?__filter_req_cmd} %{__grep} -v %{-P} '%*' | \
  }

filter_from_provides(): |
  %{expand: \
  %global __filter_from_prov %{?__filter_from_prov} | %{__sed} -e '%*' \
  }

filter_from_requires(): |
  %{expand: \
  %global __filter_from_req %{?__filter_from_req} | %{__sed} -e '%*' \
  }

filter_setup: |
  %{expand: \
  %global _use_internal_dependency_generator 0 \
  %global __deploop() while read FILE; do echo "${FILE}" | /usr/lib/rpm/rpmdeps -%{1}; done | /bin/sort -u \
  %global __find_provides /bin/sh -c "%{?__filter_prov_cmd} %{__deploop P} %{?__filter_from_prov}" \
  %global __find_requires /bin/sh -c "%{?__filter_req_cmd}  %{__deploop R} %{?__filter_from_req}" \
  }

rpm_vercmp(): "%{lua:print(rpm.expand('%1') == '~~~' and '~~~' or rpm.vercmp(rpm.expand('%1'), rpm.expand('%2')))}"
pkg_version(): "%(LC_ALL=C rpm -q --whatprovides --qf \"%%{version}\" \"%1\" | sed -e \"s/^no package provides .*/~~~/\")"
pkg_version_cmp(): "%{expand:%{expand:%%%%{rpm_vercmp %%{pkg_version %1} %%2}}}"
pkg_vcmp(): (%{expand:%%{pkg_version_cmp %1 %3}} %2 0)
generic_arches: "${{rpmGlobal.ix86}} x86_64 ${{rpmGlobal.arm}} aarch64 sw_64 loongarch64"
ldc_arches: "${{rpmGlobal.generic_arches}}"
valgrind_arches: "${{rpmGlobal.generic_arches}}"
nodejs_arches: "${{rpmGlobal.generic_arches}}"
mono_arches: "${{rpmGlobal.generic_arches}}"
fpc_arches: "${{rpmGlobal.generic_arches}}"
ghc_arches_with_ghci: "${{rpmGlobal.generic_arches}}"
ghc_arches: "${{rpmGlobal.generic_arches}}"
GNAT_arches: "${{rpmGlobal.GPRbuild_arches}} ${{rpmGlobal.generic_arches}}"
GPRbuild_arches: "${{rpmGlobal.generic_arches}}"
nim_arches: "${{rpmGlobal.generic_arches}}"
ocaml_native_compiler: "${{rpmGlobal.generic_arches}}"
ocaml_natdynlink: "${{rpmGlobal.generic_arches}}"
ocaml_native_profiling: "${{rpmGlobal.generic_arches}}"
openblas_arches: "${{rpmGlobal.generic_arches}}"
ldconfig_post(n:): |
  %{?ldconfig:%post -p %ldconfig %{?*} %{-n:-n %{-n*}}\
  %end}

ldconfig_postun(n:): |
  %{?ldconfig:%postun -p %ldconfig %{?*} %{-n:-n %{-n*}}\
  %end}

ldconfig_scriptlets(n:): |
  %{?ldconfig:\
  %ldconfig_post %{?*} %{-n:-n %{-n*}}\
  %ldconfig_postun %{?*} %{-n:-n %{-n*}}\
  }

_metainfodir: "${{rpmGlobal._datadir}}/metainfo"
rpmmacrodir: /usr/lib/rpm/macros.d
_monogacdir: "${{rpmGlobal._monodir}}/gac"
_monodir: "${{rpmGlobal._prefix}}/lib/mono"
_vpath_builddir: "%_target_platform"
_vpath_srcdir: .
disable_rpath: |
  sed -i 's|^hardcode_libdir_flag_spec=.*|hardcode_libdir_flag_spec=""|g' libtool \
  sed -i 's|^runpath_var=LD_RUN_PATH|runpath_var=DIE_RPATH_DIE|g' libtool

delete_la_and_a: |
  find $RPM_BUILD_ROOT -type f -name "*.la" -delete \
  find $RPM_BUILD_ROOT -type f -name "*.a" -delete

delete_la: find $RPM_BUILD_ROOT -type f -name "*.la" -delete
chrpath_delete: find $RPM_BUILD_ROOT/ -type f -exec file {} ';' | grep "\<ELF\>" | awk -F ':' '{print $1}' | xargs -i chrpath --delete {}
package_help: |
  %package        help \
  Summary:        Documents for %{name} \
  Buildarch:      noarch \
  Requires:       man info \
  \
  %description help \
  Man pages and other related documents for %{name}.

install_info(): "/sbin/install-info %1 ${{rpmGlobal._infodir}}/dir || :"
install_info_rm(): "/sbin/install-info --remove %1 ${{rpmGlobal._infodir}}/dir || :"
__perl: /usr/bin/perl
requires_eq(): "%(LC_ALL=\"C\" echo '%*' | xargs -r rpm -q --qf 'Requires: %%{name} = %%{epoch}:%%{version}\\n' | sed -e 's/ (none):/ /' -e 's/ 0:/ /' | grep -v \"is not\")"
perl_sitearch: "%(eval \"`${{rpmGlobal.__perl}} -V:installsitearch`\"; echo $installsitearch)"
perl_sitelib: "%(eval \"`${{rpmGlobal.__perl}} -V:installsitelib`\"; echo $installsitelib)"
perl_vendorarch: "%(eval \"`${{rpmGlobal.__perl}} -V:installvendorarch`\"; echo $installvendorarch)"
perl_vendorlib: "%(eval \"`${{rpmGlobal.__perl}} -V:installvendorlib`\"; echo $installvendorlib)"
perl_archlib: "%(eval \"`${{rpmGlobal.__perl}} -V:installarchlib`\"; echo $installarchlib)"
perl_privlib: "%(eval \"`${{rpmGlobal.__perl}} -V:installprivlib`\"; echo $installprivlib)"

dist: "%{nil}"
openEuler: "2"
