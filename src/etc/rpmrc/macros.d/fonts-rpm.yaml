linuxtext(e:n): |
    %{expand:
    for textfile in %* ; do
      %{!-n:
        iconv -f %{-e*}%{!-e:$(uchardet "${textfile}")} -t UTF-8 -o "${textfile}.tmp" "${textfile}"
        touch -r "${textfile}" "${textfile}.tmp"
        mv "${textfile}.tmp" "${textfile}"
      }
      fold -s "${textfile}" > "${textfile}.tmp"
      LANG=C LC_ALL=C sed -e 's/\\r$// ; 1 s/^\\xef\\xbb\\xbf//' -i "${textfile}.tmp"
      touch -r "${textfile}" "${textfile}.tmp"
      mv "${textfile}.tmp" "${textfile}"
      chmod 0644 "${textfile}"
    done
    }


