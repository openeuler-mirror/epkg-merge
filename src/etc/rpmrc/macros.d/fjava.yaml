javadoc_package(L): |
  %if 0%{!?_without_javadoc:1} \
  %package javadoc \
  Summary:        API documentation for %{?scl:%{pkg_name}}%{!?scl:%{name}} \
  %description javadoc \
  API documentation for %{?scl:%{pkg_name}}%{!?scl:%{name}}. \
  %files javadoc -f .mfiles-javadoc \
  %if 0%{!?-L:1} \
  %%license %{_licensedir} \
  %exclude %dir %{_licensedir} \
  %endif \
  %endif

