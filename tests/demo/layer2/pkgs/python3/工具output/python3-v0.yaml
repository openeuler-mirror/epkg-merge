Recommends:
    - python3-setuptools
    - python3-pip
Install:
    - python3.sh
Build:
    - python3.sh
Check:
    - python3.sh
Prep:
    - python3.sh
Macros:
    - "%global branchversion 3.10"
    - "%global pyshortver 310"
    - "%bcond_with optimizations %ifarch %{ix86} x86_64"
    - "%bcond_with optimizations %else %ifarch %{ix86} x86_64"
    - "%global pylibdir %{_libdir}/python%{branchversion}"
    - "%global dynload_dir %{pylibdir}/lib-dynload"
    - "%global LDVERSION_optimized %{branchversion}"
    - "%global LDVERSION_debug     %{branchversion}d"
    - "%global SOABI_optimized cpython-%{pyshortver}-%{_arch}-linux%{_gnu}"
    - "%global SOABI_debug     cpython-%{pyshortver}d-%{_arch}-linux%{_gnu}"
    - "%global bytecode_suffixes .cpython-%{pyshortver}*.pyc"
    - "%global py_INSTSONAME_optimized libpython%{LDVERSION_optimized}.so.1.0"
    - "%global py_INSTSONAME_debug     libpython%{LDVERSION_debug}.so.1.0"
    - "%undefine py_auto_byte_compile"
    - "%global wordsize 64"
    - "%global __requires_exclude ^/usr/bin/python3"

SubPackages:
    - Name: python3-unversioned-command
      Summary: 'The \"python\" command that runs Python 3'
      Description: This package contains /usr/bin/python - the "python" command that runs Python 3.
      Requires:
          - "%{name} = %{version}-%{release}"
      Provides:
          - "python = %{version}-%{release}"
      Conflicts:
          - "python2"
      Files: "%{_bindir}/python"
      AsWholeName: yes

    - Name: devel
      Summary: Libraries and header files needed for Python development
      Description: |
          This package contains the header files and configuration needed to develop
          python3 modules.
      Requires:
          - "%{name} = %{version}-%{release}"
          - "python-rpm-macros"
          - "python3-rpm-macros"
          - "python3-rpm-generators"
          - "python3-setuptools"
      BuildRequires:
          - "python-rpm-macros"
      Provides:
          - "%{name}-2to3 = %{version}-%{release}"
          - "2to3 = %{version}-%{release}"
          - "python3-idle"
          - "python3-test"
          - "%{name}-tools = %{version}-%{release}"
      Obsoletes:
          - "python3-idle"
          - "python3-test"
          - "%{name}-tools < %{version}-%{release}"
      Conflicts:
          - "%{name} < %{version}-%{release}"
      Files: |
          %{_bindir}/2to3
          
          %{pylibdir}/config-%{LDVERSION_optimized}-%{_arch}-linux%{_gnu}/*
          %exclude %{pylibdir}/config-%{LDVERSION_optimized}-%{_arch}-linux%{_gnu}/Makefile
          %exclude %{_includedir}/python%{LDVERSION_optimized}/%{_pyconfig_h}
          %{_includedir}/python%{LDVERSION_optimized}/*.h
          %{_includedir}/python%{LDVERSION_optimized}/internal/
          %{_includedir}/python%{LDVERSION_optimized}/cpython/
          %doc Misc/README.valgrind Misc/valgrind-python.supp Misc/gdbinit
          
          %{_bindir}/python3-config
          %{_libdir}/pkgconfig/python3.pc
          %{_libdir}/pkgconfig/python3-embed.pc
          %{_bindir}/pathfix.py
          %{_bindir}/pygettext3.py
          %{_bindir}/msgfmt3.py
          
          %{_bindir}/pygettext%{branchversion}.py
          %{_bindir}/msgfmt%{branchversion}.py
          
