          %{_datadir}/icons/hicolor/*/apps/idle3.*
          
          %{pylibdir}/ctypes/test
          %{pylibdir}/distutils/tests
          %{pylibdir}/sqlite3/test
          %{pylibdir}/test
          %exclude %{pylibdir}/test/capath
