buildRequires:
- gcc
files: |
  %license COPYING
  %attr(0755,root,root) %{_libdir}/libaio.so.*
meta.description: |
  The Linux-native asynchronous I/O facility ("async I/O", or "aio") has a
  richer API and capability set than the simple POSIX async I/O facility.
  This library, libaio, provides the Linux-native API for async I/O.
  The POSIX async I/O facility requires this library in order to provide
  kernel-accelerated async I/O capabilities, as do applications which
  require the Linux-native async I/O API.
meta.homepage: https://pagure.io/libaio
meta.license: LGPLv2+
meta.summary: Linux-native asynchronous I/O access library
name: libaio
patchset:
  '0': 0000-libaio-install-to-destdir-slash-usr.patch
  '1': 0001-libaio-arm64-ilp32.patch
  '2': 0002-libaio-makefile-cflags.patch %ifarch aarch64 aarch64_ilp32 x86_64
  '3': 0003-libaio-fix-for-x32.patch
  '4': 0004-libaio-makefile-add-D_FORTIFY_SOURCE-flag.patch
  '5': 0005-Fix-compile-error-that-exec-checking-need-super-priv.patch
phase.build: |+
  make -C setup-%{name}-%{version} soname='libaio.so.1.0.0' libname='libaio.so.1.0.0'
  make

phase.check: |+
  make check

phase.install: |+
  pushd setup-%{name}-%{version}
  install -D -m 755 src/libaio.so.1.0.0 \
    $RPM_BUILD_ROOT/%{_libdir}/libaio.so.1.0.0
  popd
  make destdir=$RPM_BUILD_ROOT prefix=/ libdir=/%{_lib} usrlibdir=%{_libdir} \
          includedir=%{_includedir} install

  rm -rf %{buildroot}%{_usr}/%{_lib}/libaio.a

  %ldconfig_scriptlets

phase.prep: |+
  %setup -q -a 0
  %patch0   -p1 -b .install-to-destdir-slash-usr
  %patch1   -p1 -b .arm64-ilp32
  %ifarch aarch64 aarch64_ilp32 x86_64
  %patch2   -p1 -b .makefile-cflags
  %endif
  %patch3   -p1 -b .fix-x32
  %patch4   -p1 -b .makefile-add-D_FORTIFY_SOURCE-flag
  %patch5   -p1 -b .fix-compile-error

  mv %{name}-%{version} setup-%{name}-%{version}

release: 5
source:
  '0': https://releases.pagure.org/libaio/libaio-%{version}.tar.gz
subpackage:
  libaio-devel:
    files: |
      %attr(0644,root,root) %{_includedir}/*
      %attr(0755,root,root) %{_libdir}/libaio.so
    meta.description: Files for libaio development
    meta.summary: Files for libaio development
    requires:
    - '%{name}%{?_isa} = %{version}-%{release}'
version: 0.3.112
