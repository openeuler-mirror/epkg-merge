buildRequires:
- gzip automake autoconf gcc
- glibc-devel libselinux-devel libacl-devel perl-Getopt-Long
files: |
  %license COPYING
  %{_bindir}/sed
filesInput: '%{name}.lang'
meta.description: |
  Sed is a non-interactive command-line text editor. A stream editor is used
  to per-form basic text transformations on an input stream (a file or input
  from a pipeline).
meta.homepage: https://www.gnu.org/software/sed/
meta.license: GPLv3+
meta.summary: non-interactive command-line text editor
name: sed
patchset:
  '0': backport-sed-c-flag.patch
  '1': backport-sed-handle-very-long-execution-lines-tiny-change.patch
  '2': backport-sed-handle-very-long-input-lines-with-R-tiny-change.patch
phase.build: |+
  %configure --without-included-regex \

  make %{?_smp_mflags}

phase.install: |+
  %make_install
  %find_lang %{name}

phase.prep: |+
  %autosetup -n %{name}-%{version} -p1

provides:
- /bin/sed
- bundled(gnulib)
release: 2
source:
  '0': http://ftp.gnu.org/gnu/sed/%{name}-%{version}.tar.xz
subpackage:
  sed-help:
    buildArch: noarch
    files: |
      %doc ABOUT-NLS AUTHORS BUGS ChangeLog* INSTALL NEWS README THANKS
      %{_infodir}/*.info.gz
      %exclude %{_infodir}/dir*
      %{_mandir}/man1/*.1.gz
    meta.description: Man pages and other related documents for %{name}.
    meta.summary: Documents for %{name}
    requires:
    - man info
version: 4.8
