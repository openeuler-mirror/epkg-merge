buildRequires:
- gcc make rpm-build
files: |
  %defattr(-,root,root)
  %{_libdir}/libboundscheck.so
  %{_includedir}/securec.h
  %{_includedir}/securectype.h
  %doc README.md
  %license LICENSE
meta.description: |
  libboundscheck provides a set of functions of
  the common memory/string operation classes.
meta.homepage: https://gitee.com/openeuler/libboundscheck
meta.license: Mulan PSL v2
meta.summary: Enhanced safety functions
name: libboundscheck
phase.build: |+
  make %{?_smp_mflags}

phase.clean: |+
  rm -rf %{buildroot}

phase.install: |+
  mkdir -p %{buildroot}%{_libdir}/
  mkdir -p %{buildroot}%{_includedir}/
  cp lib/*.so %{buildroot}%{_libdir}/
  cp include/securec.h %{buildroot}%{_includedir}/
  cp include/securectype.h %{buildroot}%{_includedir}/

phase.prep: |+
  %setup -q

release: 6
requires:
- glibc
rpmMacros:
- '%define debug_package %{nil}'
runtimePhase.post: |2+

runtimePhase.postun: |2+

source:
  '0': https://gitee.com/openeuler/libboundscheck/repository/archive/%{name}-%{version}.tar.gz
version: null
