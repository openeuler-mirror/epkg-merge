buildRequires:
- gcc chrpath zlib-devel xz-devel libxslt openssl-devel
files: |
  %exclude %{_libdir}/*.la

  %dir %{_sysconfdir}/*.d
  %dir %{_prefix}/lib/modprobe.d

  %{_bindir}/kmod
  %{_sbindir}/*
  %{_datadir}/bash-completion/
  %{_sysconfdir}/depmod.d/dist.conf
meta.description: |
  The kmod package provides several commands to manage the kernel modules,
  such as insmod to load and rmmod to unload the modules.
meta.homepage: http://git.kernel.org/?p=utils/kernel/kmod/kmod.git;a=summary
meta.license: GPLv2+ and LGPLv2+
meta.summary: Kernel module management
name: kmod
patchset:
  '0': 0001-Module-replace-the-module-with-new-module.patch
  '1': 0002-Module-suspend-the-module-by-rmmod-r-option.patch
phase.build: |+
  %configure --with-openssl \
  --with-zlib \
  --with-xz \
  --enable-python
  %make_build

phase.install: |+
  %make_install
  rm -f %{buildroot}%{python3_sitearch}/kmod/*.la
  pushd $RPM_BUILD_ROOT/%{_mandir}/man5
  ln -s modprobe.d.5.gz modprobe.conf.5.gz
  popd

  mkdir -p $RPM_BUILD_ROOT%{_sbindir}
  for i in $RPM_BUILD_ROOT%{_sbindir}/modprobe $RPM_BUILD_ROOT%{_sbindir}/modinfo $RPM_BUILD_ROOT%{_sbindir}/insmod \
           $RPM_BUILD_ROOT%{_sbindir}/rmmod $RPM_BUILD_ROOT%{_sbindir}/depmod $RPM_BUILD_ROOT%{_sbindir}/lsmod
  do
  ln -sf ../bin/kmod $i
  done

  mkdir -p $RPM_BUILD_ROOT%{_sysconfdir}/modprobe.d
  mkdir -p $RPM_BUILD_ROOT%{_sysconfdir}/depmod.d
  mkdir -p $RPM_BUILD_ROOT%{_prefix}/lib/modprobe.d
  mkdir -p $RPM_BUILD_ROOT/sbin

  install -m 755 %{SOURCE1} $RPM_BUILD_ROOT%{_sbindir}/weak-modules
  install -m 0644 %{SOURCE2} $RPM_BUILD_ROOT%{_sysconfdir}/depmod.d/dist.conf

phase.prep: |+
  %autosetup -n %{name}-%{version} -p1

provides:
- module-init-tools = 4.0-1
- /sbin/modprobe
release: 2
runtimePhase.post: |+
  -p /sbin/ldconfig

runtimePhase.postun: |+
  -p /sbin/ldconfig

source:
  '0': https://www.kernel.org/pub/linux/utils/kernel/kmod/%{name}-%{version}.tar.xz
  '1': weak-modules
  '2': depmod.conf.dist
subpackage:
  kmod-devel:
    files: |
      %{_includedir}/libkmod.h
      %{_libdir}/pkgconfig/libkmod.pc
      %{_libdir}/libkmod.so
    meta.description: |
      The kmod-devel package provides header files used for loading or unloading
      kernel modules.
    meta.summary: Header files for kmod development
    requires:
    - '%{name} = %{version}-%{release} %{name}-libs'
  kmod-help:
    files: |
      %attr(0644,root,root) %{_mandir}/man5/*.5*
      %attr(0644,root,root) %{_mandir}/man8/*.8*

      %doc TODO NEWS README.md
    meta.description: |
      The kmod-help package provides several documents and the man pages to help
      developers to understand the kmod.
    meta.summary: Documents and man pages for the kmod
    requires:
    - man info
  kmod-libs:
    files: |
      %{!?_licensedir:%global license None
      %license COPYING
      %{_libdir}/libkmod.so.*
    meta.description: |
      The kmod-libs package provides runtime libraries for any application that
      wishes to load or unload Linux kernel modules from the running system.
    meta.license: LGPLv2+
    meta.summary: Libraries to handle kernel module loading and unloading
  python3-kmod:
    buildRequires:
    - python3 python3-devel python3-Cython kmod-devel kmod-libs
    files: |
      %{python3_sitearch}/kmod/
    meta.description: |
      python3-kmod is a Python3 wrapper module for libkmod, exposing common
      module operations: listing installed modules, modprobe, and rmmod.
    meta.summary: Python3 bindings for kmod/libkmod.
    requires:
    - python3
version: 30
