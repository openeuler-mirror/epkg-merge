buildRequires:
- chrpath gcc gcc-c++ gettext perl-interpreter
- glibc-devel libattr-devel libselinux-devel meson
- systemtap-sdt-devel pkgconfig(libelf) pkgconfig(libffi)
- pkgconfig(libpcre) pkgconfig(mount) pkgconfig(zlib)
- python3-devel
- desktop-file-utils shared-mime-info gtk-doc %ifnarch i686
- pkgconfig(sysprof-capture-4) %ifnarch i686 %if %{?openEuler:1}0
conflicts:
- gcr < 3.28.1
files: |
  %defattr(-,root,root)
  %doc AUTHORS NEWS README
  %license COPYING
  %{_libdir}/*.so.*
  %dir %{_libdir}/gio
  %ghost %{_libdir}/gio/modules/giomodule.cache

  %dir %{_datadir}/glib-2.0
  %dir %{_datadir}/bash-completion
  %{_datadir}/bash-completion/completions/gapplication
  %{_datadir}/bash-completion/completions/gdbus
  %{_datadir}/bash-completion/completions/gio
  %{_datadir}/bash-completion/completions/gsettings

  %{_bindir}/gio
  %{_bindir}/gio-querymodules*
  %{_bindir}/glib-compile-schemas
  %{_bindir}/gsettings
  %{_bindir}/gdbus
  %{_bindir}/gapplication
filesInput: glib20.lang
meta.description: |
  GLib is a bundle of three (formerly five) low-level system libraries
  written in C and developed mainly by GNOME. GLib's code was separated
  from GTK, so it can be used by software other than GNOME and has been
  developed in parallel ever since.
meta.homepage: http://www.gtk.org
meta.license: LGPLv2+
meta.summary: The core library that forms the basis for projects such as GTK+ and
  GNOME
name: glib2
obsoletes:
- '%{name}-fam < %{version}-%{release}'
patchset:
  '0': backport-add-version-macros-for-GLib-2.74.patch
  '1': backport-gtype-Add-G_TYPE_FLAG_NONE.patch
  '10': backport-gregex-format-specifier-for-localized-error-message.patch
  '11': backport-gregex-ensure-we-translate-the-errcode.patch
  '12': backport-gregex-Free-match-info-if-offset-matching-recalc-failed.patch
  '13': backport-gregex-use-G_REGEX_OPTIMIZE-flag-to-enable-JIT-compilation.patch
  '14': backport-gregex-use-g_debug-instead-of-g_warning-in-case-JIT-is-not-available.patch
  '15': backport-gregex-do-not-set-match-and-recursion-limits-on-match-context.patch
  '16': backport-gregex-add-original-test-case.patch
  '17': backport-gregex-use-correct-size-for-pcre2_pattern_info.patch
  '2': backport-gioenums-Add-G_TLS_CERTIFICATE_FLAGS_NONE.patch
  '3': backport-gtestutils-Add-G_TEST_SUBPROCESS_DEFAULT.patch
  '4': backport-gsignal-Add-G_CONNECT_DEFAULT.patch
  '5': backport-giomodule-test-Dont-pass-a-magic-number-to-g_test_trap_subprocess.patch
  '6': backport-giochannel-Add-G_IO_FLAG_NONE.patch
  '7': backport-gmarkup-Add-G_MARKUP_PARSE_FLAGS_NONE.patch
  '8': backport-gregex-Add-G_REGEX_DEFAULT-G_REGEX_MATCH_DEFAULT.patch
  '9': backport-replace-pcre1-with-pcre2.patch
phase.build: |+
  rm -rf glib/pcre/*.[ch]

  %meson --default-library=both  -Ddtrace=true  \
  %ifnarch i686
  %if %{?openEuler:1}0
  -Dsysprof=enabled \
  %endif
  -Dman=true -Dgtk_doc=true \
  %else
  -Dsysprof=disabled -Dman=false -Dgtk_doc=false \
  %endif
  -Dsystemtap=true -Dinstalled_tests=true \
      -Dglib_debug=disabled

  %meson_build
  find . -name *.dtrace-temp.c -exec rm -f {} \;

phase.check: |+
  %meson_test

phase.install: |+
  %meson_install
  %global py_reproducible_pyc_path %{buildroot}%{_datadir}
  touch -r gio/gdbus-2.0/codegen/config.py.in %{buildroot}%{_datadir}/glib-2.0/codegen/*.py
  chrpath --delete %{buildroot}%{_libdir}/*.so

  export PYTHONHASHSEED=0
  %py_byte_compile %{__python3} %{buildroot}%{_datadir}

  mv %{buildroot}%{_bindir}/gio-querymodules %{buildroot}%{_bindir}/gio-querymodules-%{__isa_bits}
  sed -i -e "/^gio_querymodules=/s/gio-querymodules/gio-querymodules-%{__isa_bits}/" %{buildroot}%{_libdir}/pkgconfig/gio-2.0.pc
  mkdir -p %{buildroot}%{_libdir}/gio/modules
  touch %{buildroot}%{_libdir}/gio/modules/giomodule.cache

  rm -rf %{buildroot}/%{_datadir}/gdb/auto-load/%{_libdir}/__pycache__
  rm -rf %{buildroot}/%{_datadir}/glib-2.0/codegen/__pycache__
  rm -rf %{buildroot}/%{_datadir}/glib-2.0/gdb/__pycache__

  chrpath -d %{buildroot}%{_libexecdir}/installed-tests/glib/gdbus-peer

  %find_lang glib20

  %transfiletriggerin -- %{_libdir}/gio/modules
  gio-querymodules-%{__isa_bits} %{_libdir}/gio/modules &> /dev/null || :

  %transfiletriggerpostun -- %{_libdir}/gio/modules
  gio-querymodules-%{__isa_bits} %{_libdir}/gio/modules &> /dev/null || :

  %transfiletriggerin -- %{_datadir}/glib-2.0/schemas
  glib-compile-schemas %{_datadir}/glib-2.0/schemas &> /dev/null || :

  %transfiletriggerpostun -- %{_datadir}/glib-2.0/schemas
  glib-compile-schemas %{_datadir}/glib-2.0/schemas &> /dev/null || :

phase.prep: |+
  %autosetup -n glib-%{version} -p1

provides:
- '%{name}-fam = %{version}-%{release}'
- bundled(gnulib)
- bundled(gvdb)
- bundled(libcharset)
- bundled(xdgmime)
recommends:
- shared-mime-info
release: 3
source:
  '0': https://download.gnome.org/sources/glib/2.71/glib-%{version}.tar.xz
subpackage:
  glib2-devel:
    files: |
      %{_libdir}/lib*.so
      %{_libdir}/glib-2.0
      %{_libdir}/pkgconfig/*
      %{_libdir}/*.a
      %{_includedir}/*
      %{_libexecdir}/installed-tests
      %exclude %{_libexecdir}/installed-tests/glib/cert-tests
      %exclude %{_libexecdir}/installed-tests/glib/tls-certificate

      %{_datadir}/aclocal/*
      %{_datadir}/glib-2.0/*
      %{_datadir}/bash-completion/completions/gresource
      %{_datadir}/gdb/auto-load/%{_libdir}/*-gdb.py
      %{_datadir}/gettext/
      %{_datadir}/systemtap/
      %{_datadir}/installed-tests
      %exclude %{_datadir}/installed-tests/glib/tls-certificate.test

      %{_bindir}/glib-genmarshal
      %{_bindir}/glib-gettextize
      %{_bindir}/glib-mkenums
      %{_bindir}/gobject-query
      %{_bindir}/gtester
      %{_bindir}/gdbus-codegen
      %{_bindir}/glib-compile-resources
      %{_bindir}/gresource
      %attr (0755, root, root) %{_bindir}/gtester-report
    meta.description: Development and test files for the GLib library.
    meta.summary: Development and test files for the GLib library
    obsoletes:
    - '%{name}-static < %{version}-%{release}'
    - '%{name}-tests < %{version}-%{release}'
    provides:
    - '%{name}-static = %{version}-%{release}'
    - '%{name}-tests = %{version}-%{release}'
    requires:
    - '%{name} = %{version}-%{release}'
    - gdb-headless
  glib2-help rpmWhen %ifnarch i686:
    buildArch: noarch
    files: |
      %defattr(-,root,root)
      %{_mandir}/man1/*
      %doc %{_datadir}/gtk-doc/html/*
    meta.description: help document for the glib2 package.
    meta.summary: help document for the glib2 package
    obsoletes:
    - '%{name}-doc < %{version}-%{release} '
    provides:
    - '%{name}-doc = %{version}-%{release} '
version: 2.72.2
