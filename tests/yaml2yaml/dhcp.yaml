meta.description: The Dynamic Host Configuration Protocol (DHCP) is a network management
  protocol used on UDP/IP networks whereby a DHCP server dynamically assigns an IP
  address and other network configuration parameters to each device on a network so
  they can communicate with other IP networks.
meta.homepage: https://www.isc.org/dhcp/
meta.license: ISC
meta.summary: Dynamic host configuration protocol software
name: dhcp
obsoletes:
- '%{name}-common %{name}-libs %{name}-server %{name}-relay %{name}-compat %{name}-client'
- dhcp < %{epoch}:%{version}-%{release}
- dhclient < %{epoch}:%{version}-%{release}
