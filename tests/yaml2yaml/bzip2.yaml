buildRequires:
- gcc
files: |
  %defattr(-,root,root)
  %doc CHANGES LICENSE README
  %license LICENSE
  %{_bindir}/*
  %{_libdir}/*.so.*
meta.description: |
  bzip2 is a freely available, patent free, high-quality data compressor.
  It typically compresses files to within 10% to 15% of the best available
  techniques (the PPM family of statistical compressors), whilst being
  around twice as fast at compression and six times faster at decompression.
meta.homepage: https://www.sourceware.org/bzip2/
meta.license: BSD
meta.summary: A high-quality data compressor
name: bzip2
obsoletes:
- bzip2-libs
patchset:
  '0': 0001-add-compile-option.patch
  '1': 0002-CVE-2019-12900.patch
phase.build: |+
  %make_build -f Makefile-libbz2_so "CFLAGS=%{optflags} -Winline -fpic -fPIC -D_FILE_OFFSET_BITS=64"
  %make_build "CFLAGS=%{optflags} -fpic -fPIC -Winline -D_FILE_OFFSET_BITS=64"

phase.check: |+
  make check

  %ldconfig_scriptlets

phase.install: |+
  rm -rf %RPM_BUILD_ROOT
  %make_install PREFIX=%{buildroot}%{_prefix}

  pushd %{buildroot}%{_prefix}
  mkdir -p share
  mv man/ share/
  mv lib lib64
  popd

  ln -fs bzdiff %{buildroot}%{_bindir}/bzcmp
  ln -fs bzgrep %{buildroot}%{_bindir}/bzegrep
  ln -fs bzgrep %{buildroot}%{_bindir}/bzfgrep
  ln -fs bzmore %{buildroot}%{_bindir}/bzless
  install -m 0755 libbz2.so.%{version}  %{buildroot}%{_libdir}
  ln -s libbz2.so.%{version} %{buildroot}%{_libdir}/libbz2.so.1
  ln -s libbz2.so.1 %{buildroot}%{_libdir}/libbz2.so
  cp %{SOURCE1} .
  sed -i "s@^libdir=@libdir=%{_libdir}@" bzip2.pc
  mkdir -p %{buildroot}%{_libdir}/pkgconfig
  install -m 0644 bzip2.pc %{buildroot}%{_libdir}/pkgconfig/
  ln -s bzip2.1.gz %{buildroot}%{_mandir}/man1/bunzip2.1.gz
  ln -s bzip2.1.gz %{buildroot}%{_mandir}/man1/bzcat.1.gz
  ln -s bzip2.1.gz %{buildroot}%{_mandir}/man1/bzip2recover.1.gz

phase.prep: |+
  %autosetup -n %{name}-%{version} -p1

provides:
- bzip2-libs
release: 5
source:
  '0': https://sourceware.org/pub/bzip2/%{name}-%{version}.tar.gz
  '1': bzip2.pc
subpackage:
  bzip2-devel:
    files: |
      %defattr(-,root,root)
      %{_includedir}/bzlib.h
      %{_libdir}/*.so
      %{_libdir}/pkgconfig/
      %{_libdir}/*.a
    meta.description: header files for bzip2
    meta.summary: header files for bzip2
    obsoletes:
    - bzip2-static
    provides:
    - bzip2-static
    requires:
    - '%{name} = %{version}-%{release}'
  bzip2-help:
    buildArch: noarch
    files: |
      %doc manual.html manual.pdf
      %{_mandir}/man1/b*.1.gz
    meta.description: Man pages and other related documents for %{name}.
    meta.summary: Documents for %{name}
    requires:
    - man info
version: 1.0.8
