Exclusiveos:
- Linux
buildRequires:
- module-init-tools, patch >= 2.5.4, bash >= 2.03, tar
- bzip2, xz, findutils, gzip, m4, perl, make >= 3.78, diffutils, gawk
- libcap-devel, libcap-ng-devel, rsync
- gcc >= 3.4.2, binutils >= 2.12
- hostname, net-tools, bc
- xmlto, asciidoc
- openssl-devel openssl
- hmaccalc
- ncurses-devel
- elfutils-libelf-devel
- rpm >= 4.14.2
- python-devel %if 0%{?with_python2}
- elfutils-devel zlib-devel binutils-devel newt-devel perl(ExtUtils::Embed) bison
- audit-libs-devel
- pciutils-devel gettext
- rpm-build, elfutils
- numactl-devel python3-devel glibc-static python3-docutils
- perl-generators perl(Carp) libunwind-devel gtk2-devel libbabeltrace-devel java-1.8.0-openjdk
  perl-devel
- flex xz-devel libzstd-devel %if %{with_perf}
- java-devel %if %{with_perf}
- dwarves
- clang >= 10.0.0
- llvm
conflicts:
- device-mapper-libs < 1.02.63-2 e2fsprogs < 1.37-4 initscripts < 7.23 iptables <
  1.3.2-1
- ipw2200-firmware < 2.4 isdn4k-utils < 3.2-32 iwl4965-firmware < 228.57.2 jfsutils
  < 1.1.7-2
- mdadm < 3.2.1-5 nfs-utils < 1.0.7-12 oprofile < 0.9.1-2 ppp < 2.4.3-3 procps < 3.2.5-6.3
- reiserfs-utils < 3.6.19-2 selinux-policy-targeted < 1.25.3-14 squashfs-tools < 4.0
- udev < 063-6 util-linux < 2.12 wireless-tools < 29-3 xfsprogs < 2.6.13-4
exclusiveArch:
- noarch aarch64 i686 x86_64
files: |
  %doc
  /boot/config-*
  %ifarch aarch64
  /boot/dtb-*
  %endif
  /boot/symvers-*
  /boot/System.map-*
  /boot/vmlinuz-*
  %ghost /boot/initramfs-%{KernelVer}.img
  /boot/.vmlinuz-*.hmac
  /etc/ld.so.conf.d/*
  /lib/modules/%{KernelVer}/
  %exclude /lib/modules/%{KernelVer}/source
  %exclude /lib/modules/%{KernelVer}/build
  %{_sbindir}/mkgrub-menu*.sh
meta.description: The Linux Kernel, the operating system core itself.
meta.homepage: http://www.kernel.org/
meta.license: GPLv2
meta.summary: Linux Kernel
name: kernel%{?package64kb}
phase.build: |+
  cd linux-%{KernelVer}

  perl -p -i -e "s/^EXTRAVERSION.*/EXTRAVERSION = -%{release}.%{_target_cpu}/" Makefile

  make mrproper %{_smp_mflags}

  %if %{with_64kb}
  sed -i arch/arm64/configs/openeuler_defconfig -e 's/^CONFIG_ARM64_4K_PAGES.*/CONFIG_ARM64_64K_PAGES=y/'
  sed -i arch/arm64/configs/openeuler_defconfig -e 's/^CONFIG_ARM64_PA_BITS=.*/CONFIG_ARM64_PA_BITS=52/'
  sed -i arch/arm64/configs/openeuler_defconfig -e 's/^CONFIG_ARM64_PA_BITS_.*/CONFIG_ARM64_PA_BITS_52=y/'
  sed -i arch/arm64/configs/openeuler_defconfig -e 's/^CONFIG_ARM64_VA_BITS=.*/CONFIG_ARM64_VA_BITS=52/'
  sed -i arch/arm64/configs/openeuler_defconfig -e 's/^CONFIG_ARM64_VA_BITS_.*/CONFIG_ARM64_VA_BITS_52=y/'
  %endif

  make ARCH=%{Arch} openeuler_defconfig

  TargetImage=$(basename $(make -s image_name))

  make ARCH=%{Arch} $TargetImage %{?_smp_mflags}
  make ARCH=%{Arch} modules %{?_smp_mflags}

  %if 0%{?with_kabichk}
  chmod 0755 %{SOURCE5}
  if [ -e $RPM_SOURCE_DIR/Module.kabi_%{_target_cpu} ]; then
  ##%{SOURCE5} -k $RPM_SOURCE_DIR/Module.kabi_%{_target_cpu} -s Module.symvers || exit 1
  echo "**** NOTE: now don't check Kabi. ****"
  else
  echo "**** NOTE: Cannot find reference Module.kabi file. ****"
  fi
  %endif

  %ifarch aarch64
  make ARCH=%{Arch} dtbs
  %endif

  %if %{with_perf}
  # perf
  %global perf_make \
      make EXTRA_CFLAGS="-Wl,-z,now -g -Wall -fstack-protector-strong -fPIC" EXTRA_PERFLIBS="-fpie -pie" %{?_smp_mflags} -s V=1 WERROR=0 NO_LIBUNWIND=1 HAVE_CPLUS_DEMANGLE=1 NO_GTK2=1 NO_LIBNUMA=1 NO_STRLCPY=1 prefix=%{_prefix}
  %if 0%{?with_python2}
  %global perf_python2 -C tools/perf PYTHON=%{__python2}
  %global perf_python3 -C tools/python3-perf PYTHON=%{__python3}
  %else
  %global perf_python3 -C tools/perf PYTHON=%{__python3}
  %endif

  chmod +x tools/perf/check-headers.sh
  # perf
  %if 0%{?with_python2}
  %{perf_make} %{perf_python2} all
  %endif

  # make sure check-headers.sh is executable
  chmod +x tools/python3-perf/check-headers.sh
  %{perf_make} %{perf_python3} all

  pushd tools/perf/Documentation/
  make %{?_smp_mflags} man
  popd
  %endif

  pushd tools/bpf/bpftool
  make
  popd

  chmod +x tools/power/cpupower/utils/version-gen.sh
  make %{?_smp_mflags} -C tools/power/cpupower CPUFREQ_BENCH=false
  %ifarch %{ix86}
  pushd tools/power/cpupower/debug/i386
  make %{?_smp_mflags} centrino-decode powernow-k8-decode
  popd
  %endif
  %ifarch x86_64
  pushd tools/power/cpupower/debug/x86_64
  make %{?_smp_mflags} centrino-decode powernow-k8-decode
  popd
  %endif
  %ifarch %{ix86} x86_64
  pushd tools/power/x86/x86_energy_perf_policy/
  make
  popd
  pushd tools/power/x86/turbostat
  make
  popd
  %endif
  pushd tools/thermal/tmon/
  make
  popd
  pushd tools/iio/
  make
  popd
  pushd tools/gpio/
  make
  popd
  pushd tools/kvm/kvm_stat/
  make %{?_smp_mflags} man
  popd

phase.install: |
  %if 0%{?with_source}
  %define _python_bytecompile_errors_terminate_build 0
  mkdir -p $RPM_BUILD_ROOT/usr/src/
  mv linux-%{KernelVer}-source $RPM_BUILD_ROOT/usr/src/linux-%{KernelVer}
  cp linux-%{KernelVer}/.config $RPM_BUILD_ROOT/usr/src/linux-%{KernelVer}/
  cp linux-%{KernelVer}/.scmversion $RPM_BUILD_ROOT/usr/src/linux-%{KernelVer}/
  %endif

  cd linux-%{KernelVer}



  mkdir -p $RPM_BUILD_ROOT/boot
  dd if=/dev/zero of=$RPM_BUILD_ROOT/boot/initramfs-%{KernelVer}.img bs=1M count=20

  install -m 755 $(make -s image_name) $RPM_BUILD_ROOT/boot/vmlinuz-%{KernelVer}
  pushd $RPM_BUILD_ROOT/boot
  sha512hmac ./vmlinuz-%{KernelVer} >./.vmlinuz-%{KernelVer}.hmac
  popd

  install -m 644 .config $RPM_BUILD_ROOT/boot/config-%{KernelVer}
  install -m 644 System.map $RPM_BUILD_ROOT/boot/System.map-%{KernelVer}

  gzip -c9 < Module.symvers > $RPM_BUILD_ROOT/boot/symvers-%{KernelVer}.gz

  mkdir -p $RPM_BUILD_ROOT%{_sbindir}
  install -m 755 %{SOURCE7} $RPM_BUILD_ROOT%{_sbindir}/mkgrub-menu-%{devel_release}.sh


  %if 0%{?with_debuginfo}
  mkdir -p $RPM_BUILD_ROOT%{debuginfodir}/lib/modules/%{KernelVer}
  cp vmlinux $RPM_BUILD_ROOT%{debuginfodir}/lib/modules/%{KernelVer}
  %endif

  make ARCH=%{Arch} INSTALL_MOD_PATH=$RPM_BUILD_ROOT modules_install KERNELRELEASE=%{KernelVer} mod-fw=
  pushd $RPM_BUILD_ROOT/lib/modules/%{KernelVer}
  find -type f -name "*.ko" >modnames

  xargs --no-run-if-empty chmod u+x < modnames


  grep -F /drivers/ modnames | xargs --no-run-if-empty nm -upA |
  sed -n 's,^.*/\([^/]*\.ko\):  *U \(.*\)$,\1 \2,p' > drivers.undef

  collect_modules_list()
  sed -r -n -e "s/^([^ ]+) \\.?($2)\$/\\1/p" drivers.undef |
  LC_ALL=C sort -u > modules.$1
  if [ ! -z "$3" ]; then
  sed -r -e "/^($3)\$/d" -i modules.$1
  fi
phase.prep: |2

  %setup -q -n kernel-%{version} -c

  %if 0%{?with_patch}
  tar -xjf %{SOURCE13}
  %endif

  mv kernel linux-%{KernelVer}
  cd linux-%{KernelVer}

  cp %{SOURCE4} certs

  %if 0%{?with_patch}
  cp %{SOURCE10} .
  cp %{SOURCE11} .
  cp %{SOURCE12} .

  if [ ! -d patches ];then
  mv ../patches .
  fi

  Applypatches()
  set -e
  set -o pipefail
  local SERIESCONF=$1
  local PATCH_DIR=$2
  sed -i '/^#/d'  $SERIESCONF
  sed -i '/^[\s]*$/d' $SERIESCONF
  (
  echo "trap 'echo \"*** patch \$_ failed ***\"' ERR"
  echo "set -ex"
  cat $SERIESCONF | \
          sed "s!^!patch -s -F0 -E -p1 --no-backup-if-mismatch -i $PATCH_DIR/!" \
      ) | sh
provides:
- kernel-aarch64 = %{version}-%{release} kernel-drm = 4.3.0 kernel-drm-nouveau = 16
  kernel-modeset = 1
- kernel-uname-r = %{KernelVer} kernel=%{KernelVer}
release: '%{devel_release}%{?maintenance_release}%{?pkg_release}%{?extra_release}'
requires:
- dracut >= 001-7 grubby >= 8.28-2 initscripts >= 8.11.1-1 linux-firmware >= 20100806-2
  module-init-tools >= 3.16-2
rpmMacros:
- '%define with_signmodules  1'
- '%define with_kabichk 0'
- '%define modsign_cmd %{SOURCE10}'
- '%global Arch $(echo %{_host_cpu} | sed -e s/i.86/x86/ -e s/x86_64/x86/ -e s/aarch64.*/arm64/)'
- '%global KernelVer %{upstream_version}.%{upstream_sublevel}-%{release}.%{_target_cpu}'
- '%global debuginfodir /usr/lib/debug'
- '%global upstream_version    5.10'
- '%global upstream_sublevel   0'
- '%global devel_release       104'
- '%global maintenance_release .0.0'
- '%global pkg_release         .54'
- '%define with_debuginfo 1'
- '%global _missing_build_ids_terminate_build 1'
- '%global _no_recompute_build_ids 1'
- '%undefine _include_minidebuginfo'
- '%undefine _include_gdb_index'
- '%undefine _unique_build_ids'
- '%define with_source 1'
- '%define with_python2 0'
- '%define listnewconfig_fail 0'
- '%define with_64kb  %{?_with_64kb: 1} %{?!_with_64kb: 0} %ifarch aarch64'
- '%global package64kb -64kb %ifarch aarch64 %if %{with_64kb}'
- '%define with_64kb  0 %else %ifarch aarch64'
- '%define with_perf    %{?_without_perf: 0} %{?!_without_perf: 1}'
- '%define _debuginfo_template %{nil} %if 0%{?with_debuginfo}'
- '%define _debuginfo_subpackages 0 %if 0%{?with_debuginfo}'
- '%define debuginfo_template(n:) \{os.linesep}%package -n %{-n*}-debuginfo\{os.linesep}Summary:
  Debug information for package %{-n*}\{os.linesep}Group: Development/Debug\{os.linesep}AutoReq:
  0\{os.linesep}AutoProv: 1\{os.linesep}%description -n %{-n*}-debuginfo\{os.linesep}This
  package provides debug information for package %{-n*}.\{os.linesep}Debug information
  is useful when developing applications that use this\{os.linesep}package or when
  debugging this package.\{os.linesep}%{nil} %if 0%{?with_debuginfo}'
runtimePhase.post: |+
  %{_sbindir}/new-kernel-pkg --package kernel --install %{KernelVer} || exit $?

runtimePhase.posttrans: |+
  %{_sbindir}/new-kernel-pkg --package kernel --mkinitrd --dracut --depmod --update %{KernelVer} || exit $?
  %{_sbindir}/new-kernel-pkg --package kernel --rpmposttrans %{KernelVer} || exit $?
  if [ `uname -i` == "aarch64" ] &&
  [ -f /boot/EFI/grub2/grub.cfg ]; then
  /usr/bin/sh %{_sbindir}/mkgrub-menu-%{devel_release}.sh %{version}-%{devel_release}.aarch64  /boot/EFI/grub2/grub.cfg  update
  fi
  if [ -x %{_sbindir}/weak-modules ]
  then
  %{_sbindir}/weak-modules --add-kernel %{KernelVer} || exit $?
  fi
  %{_sbindir}/new-kernel-pkg --package kernel --mkinitrd --dracut --depmod --update %{KernelVer} || exit $?
  %{_sbindir}/new-kernel-pkg --package kernel --rpmposttrans %{KernelVer} || exit $?

runtimePhase.postun: |+
  %{_sbindir}/new-kernel-pkg --rminitrd --rmmoddep --remove %{KernelVer} || exit $?
  if [ -x %{_sbindir}/weak-modules ]
  then
  %{_sbindir}/weak-modules --remove-kernel %{KernelVer} || exit $?
  fi

  if [ -d /lib/modules/%{KernelVer} ] && [ "`ls -A  /lib/modules/%{KernelVer}`" = "" ]; then
  rm -rf /lib/modules/%{KernelVer}
  fi

runtimePhase.preun: |+
  if [ `uname -i` == "aarch64" ] &&
  [ -f /boot/EFI/grub2/grub.cfg ]; then
  /usr/bin/sh  %{_sbindir}/mkgrub-menu-%{devel_release}.sh %{version}-%{devel_release}.aarch64  /boot/EFI/grub2/grub.cfg  remove
  fi

source:
  '0': kernel.tar.gz
  '1': sign-modules
  '10': apply-patches %if 0%{?with_patch}
  '11': guards %if 0%{?with_patch}
  '12': series.conf %if 0%{?with_patch}
  '13': patches.tar.bz2 %if 0%{?with_patch}
  '2': x509.genkey
  '3': extra_certificates
  '4': pubring.gpg
  '5': check-kabi %if 0%{?with_kabichk}
  '6': Module.kabi_aarch64 %if 0%{?with_kabichk}
  '7': mkgrub-menu-aarch64.sh
  '8': cpupower.service
  '9': cpupower.config
subpackage:
  bpftool:
    files: |
      %{_sbindir}/bpftool
      %{_sysconfdir}/bash_completion.d/bpftool
      %{_mandir}/man8/bpftool-cgroup.8.gz
      %{_mandir}/man8/bpftool-map.8.gz
      %{_mandir}/man8/bpftool-prog.8.gz
      %{_mandir}/man8/bpftool-perf.8.gz
      %{_mandir}/man8/bpftool.8.gz
      %{_mandir}/man8/bpftool-btf.8.gz
      %{_mandir}/man8/bpftool-feature.8.gz
      %{_mandir}/man8/bpftool-gen.8.gz
      %{_mandir}/man8/bpftool-iter.8.gz
      %{_mandir}/man8/bpftool-link.8.gz
      %{_mandir}/man8/bpftool-net.8.gz
      %{_mandir}/man8/bpftool-struct_ops.8.gz
      %{_mandir}/man7/bpf-helpers.7.gz
      %license linux-%{KernelVer}/COPYING
    meta.description: |
      This package contains the bpftool, which allows inspection and simple
      manipulation of eBPF programs and maps.
    meta.summary: Inspection and simple manipulation of eBPF programs and maps
  kernel%{?package64kb}-devel:
    files: |
      %defattr (-, root, root)
      %doc
      /lib/modules/%{KernelVer}/source
      /lib/modules/%{KernelVer}/build
      /usr/src/kernels/%{KernelVer}
    meta.description: |
      This package provides kernel headers and makefiles sufficient to build modules
      against the %{KernelVer} kernel package.
    meta.summary: Development package for building kernel modules to match the %{KernelVer}
      kernel
    provides:
    - kernel-devel-uname-r = %{KernelVer}
    - kernel-devel-%{_target_cpu} = %{version}-%{release}
    requires:
    - perl findutils
    runtimePhase.post: |
      if [ -f /etc/sysconfig/kernel ]
      then
      . /etc/sysconfig/kernel || exit $?
      fi
      if [ "$HARDLINK" != "no" -a -x /usr/sbin/hardlink ]
      then
      (cd /usr/src/kernels/%{KernelVer} &&
      /usr/bin/find . -type f | while read f; do
      hardlink -c /usr/src/kernels/*.oe*.*/$f $f
      done)
      fi
  kernel%{?package64kb}-headers:
    files: |
      %defattr (-, root, root)
      /usr/include/*
    meta.description: |
      Kernel-headers includes the C header files that specify the interface
      between the Linux kernel and userspace libraries and programs.  The
      header files define structures and constants that are needed for
      building most standard programs and are also needed for rebuilding the
      glibc package.
    meta.summary: Header files for the Linux kernel for use by glibc
    obsoletes:
    - glibc-kernheaders < 3.0-46
    provides:
    - glibc-kernheaders = 3.0-46
  kernel%{?package64kb}-source:
    files rpmWhen %if 0%{?with_source}: |
      %defattr(-,root,root)
      /usr/src/linux-%{KernelVer}/*
      /usr/src/linux-%{KernelVer}/.config
      /usr/src/linux-%{KernelVer}/.scmversion
    meta.description: This package contains vaious source files from the kernel.
    meta.summary: the kernel source
  kernel%{?package64kb}-tools:
    files: |
      %{_bindir}/cpupower
      %ifarch %{ix86} x86_64
      %{_bindir}/centrino-decode
      %{_bindir}/powernow-k8-decode
      %endif
      %{_unitdir}/cpupower.service
      %{_datadir}/bash-completion/completions/cpupower
      %{_mandir}/man[1-8]/cpupower*
      %config(noreplace) %{_sysconfdir}/sysconfig/cpupower
      %ifarch %{ix86} x86_64
      %{_bindir}/x86_energy_perf_policy
      %{_mandir}/man8/x86_energy_perf_policy*
      %{_bindir}/turbostat
      %{_mandir}/man8/turbostat*
      %endif
      %{_bindir}/tmon
      %{_bindir}/iio_event_monitor
      %{_bindir}/iio_generic_buffer
      %{_bindir}/lsiio
      %{_bindir}/lsgpio
      %{_bindir}/gpio-hammer
      %{_bindir}/gpio-event-mon
      %{_bindir}/gpio-watch
      %{_mandir}/man1/kvm_stat*
      %{_bindir}/kvm_stat
      %{_libdir}/libcpupower.so.0
      %{_libdir}/libcpupower.so.0.0.1
      %license linux-%{KernelVer}/COPYING
    meta.description: |
      This package contains the tools/ directory from the kernel source
      and the supporting documentation.
    meta.summary: Assortment of tools for the Linux kernel
    obsoletes:
    - '%{name}-tools-libs'
    - cpufreq-utils < 1:009-0.6.p1
    - cpufrequtils < 1:009-0.6.p1
    - cpuspeed < 1:1.5-16
    provides:
    - '%{name}-tools-libs'
    - cpufreq-utils = 1:009-0.6.p1
    - cpufrequtils = 1:009-0.6.p1
    runtimePhase.post: |
      /sbin/ldconfig
      %systemd_post cpupower.service
    runtimePhase.postun: |
      /sbin/ldconfig
      %systemd_postun cpupower.service
    runtimePhase.preun: |
      %systemd_preun cpupower.service
  kernel%{?package64kb}-tools-devel:
    files: |
      %{_libdir}/libcpupower.so
      %{_includedir}/cpufreq.h
      %{_includedir}/cpuidle.h
    meta.description: |
      This package contains the development files for the tools/ directory from
      the kernel source.
    meta.summary: Assortment of tools for the Linux kernel
    obsoletes:
    - '%{name}-tools-libs-devel'
    provides:
    - '%{name}-tools-libs-devel = %{version}-%{release}'
    requires:
    - '%{name}-tools = %{version}-%{release}'
    - '%{name}-tools-libs = %{version}-%{release}'
  perf %if %{with_perf}:
    files: |
      %{_bindir}/perf
      %{_libdir}/libperf-jvmti.so
      %dir %{_libdir}/traceevent
      %{_libdir}/traceevent/plugins/
      %{_libexecdir}/perf-core
      %{_datadir}/perf-core/
      %{_mandir}/man[1-8]/perf*
      %{_sysconfdir}/bash_completion.d/perf
      %doc linux-%{KernelVer}/tools/perf/Documentation/examples.txt
      %dir %{_datadir}/doc/perf-tip
      %{_datadir}/doc/perf-tip/*
      %license linux-%{KernelVer}/COPYING
  perf rpmWhen %if %{with_perf}:
    meta.description: |
      This package contains the perf tool, which enables performance monitoring
      of the Linux kernel.
    meta.summary: Performance monitoring for the Linux kernel
  python2-perf %if %{with_perf} %if 0%{?with_python2}:
    files: |
      %license linux-%{KernelVer}/COPYING
      %{python2_sitearch}/*
  python3-perf %if %{with_perf}:
    files: |
      %license linux-%{KernelVer}/COPYING
      %{python3_sitearch}/*
  python3-perf rpmWhen %if %{with_perf}:
    meta.description: |
      A Python module that permits applications written in the Python programming
      language to use the interface to manipulate perf events.
    meta.summary: Python bindings for apps which will manipulate perf events
version: null
