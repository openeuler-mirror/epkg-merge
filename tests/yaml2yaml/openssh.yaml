  %patch24 -p1 -b .force_krb
  %patch26 -p1 -b .ccache_name
  %patch27 -p1 -b .k5login
  %patch28 -p1 -b .kuserok
  %patch29 -p1 -b .fromto-remote
  %patch30 -p1 -b .contexts
  %patch31 -p1 -b .log-in-chroot
  %patch32 -p1 -b .scp
  %patch25 -p1 -b .GSSAPIEnablek5users
  %patch33 -p1 -b .sshdt
  %patch34 -p1 -b .sftp-force-mode
  %patch35 -p1 -b .s390-dev
  %patch36 -p1 -b .x11max
  %patch37 -p1 -b .systemd
  %patch38 -p1 -b .refactor
  %patch39 -p1 -b .sandbox
  %patch40 -p1 -b .pkcs11-uri
  %patch41 -p1 -b .scp-ipv6
  %patch42 -p1 -b .crypto-policies
  %patch43 -p1 -b .openssl-evp
  %patch44 -p1 -b .openssl-kdf
  %patch45 -p1 -b .visibility
  %patch46 -p1 -b .x11-ipv6
  %patch47 -p1 -b .keygen-strip-doseol
  %patch48 -p1 -b .preserve-pam-errors
  %patch49 -p1 -b .kill-scp
  %patch1 -p1 -b .audit
  %patch2 -p1 -b .audit-race
  %patch17 -p1 -b .fips
  %patch0 -p1 -b .coverity

  %patch50 -p1
  %patch51 -p1
  %patch52 -p1
  %patch53 -p1
  %patch54 -p1
  %patch55 -p1
  %patch56 -p1

  autoreconf
  pushd pam_ssh_agent_auth-pam_ssh_agent_auth-0.10.4
  autoreconf
  popd

recommends:
- p11-kit
release: '%{openssh_release}'
requires:
- /sbin/nologin
- libselinux >= 2.3-5 audit-libs >= 1.0.8
- openssh-server = %{version}-%{release}
rpmMacros:
- '%global gtk2 1'
- '%global pie 1'
- '%{?no_gtk2:%global gtk2 0}'
- '%global sshd_uid    74'
- '%global openssh_release 6'
- '%{?systemd_requires}'
runtimePhase.pre: |+
  getent group ssh_keys >/dev/null || groupadd -r ssh_keys || :

source:
  '0': https://ftp.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-%{version}.tar.gz
  '1': https://ftp.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-%{version}.tar.gz.asc
  '10': sshd-keygen@.service
  '11': sshd-keygen
  '12': sshd.tmpfiles
  '13': sshd-keygen.target
  '14': ssh-agent.service
  '2': sshd.pam
  '3': http://prdownloads.sourceforge.net/pamsshagentauth/pam_ssh_agent_auth/pam_ssh_agent_auth-0.10.4.tar.gz
  '4': pam_ssh_agent-rmheaders
  '5': ssh-keycat.pam
  '6': sshd.sysconfig
  '7': sshd@.service
  '8': sshd.socket
  '9': sshd.service
subpackage:
  openssh-askpass:
    files: |
      %attr(0644,root,root) %{_sysconfdir}/profile.d/gnome-ssh-askpass.*
      %attr(0755,root,root) %{_libexecdir}/openssh/gnome-ssh-askpass
      %attr(0755,root,root) %{_libexecdir}/openssh/ssh-askpass
    meta.description: |
      OpenSSH is a free version of SSH (Secure SHell), a program for logging
      into and executing commands on a remote machine. This package contains
      an X11 passphrase dialog for OpenSSH.
    meta.summary: A passphrase dialog for OpenSSH and X
    requires:
    - openssh = %{version}-%{release}
  openssh-clients:
    files: |
      %attr(0755,root,root) %{_bindir}/ssh
      %attr(0755,root,root) %{_bindir}/scp
      %attr(0644,root,root) %config(noreplace) %{_sysconfdir}/ssh/ssh_config
      %attr(0644,root,root) %config(noreplace) %{_sysconfdir}/ssh/ssh_config.d/05-redhat.conf
      %attr(0755,root,root) %{_bindir}/ssh-agent
      %attr(0755,root,root) %{_bindir}/ssh-add
      %attr(0755,root,root) %{_bindir}/ssh-keyscan
      %attr(0755,root,root) %{_bindir}/sftp
      %attr(0755,root,root) %{_bindir}/ssh-copy-id
      %attr(0755,root,root) %{_libexecdir}/openssh/ssh-pkcs11-helper
      %attr(0755,root,root) %{_libexecdir}/openssh/ssh-sk-helper
      %attr(0755,root,root) %{_userunitdir}/ssh-agent.service
    meta.description: |
      OpenSSH is a free version of SSH (Secure SHell), a program for logging
      into and executing commands on a remote machine. This package includes
      the clients necessary to make encrypted connections to SSH servers.
    meta.summary: An open source SSH client applications
    requires:
    - openssh = %{version}-%{release}
    - crypto-policies >= 20180306-1
  openssh-help:
    buildArch: noarch
    files: |
      %doc ChangeLog OVERVIEW PROTOCOL* README README.privsep README.tun README.dns TODO
      %doc HOWTO.ssh-keycat
      %attr(0644,root,root) %{_mandir}/man1/scp.1*
      %attr(0644,root,root) %{_mandir}/man1/ssh*.1*
      %attr(0644,root,root) %{_mandir}/man1/sftp.1*
      %attr(0644,root,root) %{_mandir}/man5/ssh*.5*
      %attr(0644,root,root) %{_mandir}/man5/moduli.5*
      %attr(0644,root,root) %{_mandir}/man8/ssh*.8*
      %attr(0644,root,root) %{_mandir}/man8/pam_ssh_agent_auth.8*
      %attr(0644,root,root) %{_mandir}/man8/sftp-server.8*
    meta.description: Man pages and other related documents for %{name}.
    meta.summary: Documents for %{name}
    requires:
    - man info
  openssh-keycat:
    files: |
      %attr(0755,root,root) %{_libexecdir}/openssh/ssh-keycat
      %attr(0644,root,root) %config(noreplace) /etc/pam.d/ssh-keycat
    meta.description: |
      OpenSSH mls keycat is backend for using the authorized keys in the
      openssh in the mls mode.
    meta.summary: A mls keycat backend for openssh
    requires:
    - openssh = %{version}-%{release}
  openssh-server:
    files: |
      %dir %attr(0711,root,root) %{_var}/empty/sshd
      %attr(0755,root,root) %{_sbindir}/sshd
      %attr(0755,root,root) %{_libexecdir}/openssh/sftp-server
      %attr(0755,root,root) %{_libexecdir}/openssh/sshd-keygen
      %attr(0600,root,root) %config(noreplace) %{_sysconfdir}/ssh/sshd_config
      %attr(0644,root,root) %config(noreplace) /etc/pam.d/sshd
      %attr(0640,root,root) %config(noreplace) /etc/sysconfig/sshd
      %attr(0644,root,root) %{_unitdir}/sshd.service
      %attr(0644,root,root) %{_unitdir}/sshd@.service
      %attr(0644,root,root) %{_unitdir}/sshd.socket
      %attr(0644,root,root) %{_unitdir}/sshd-keygen@.service
      %attr(0644,root,root) %{_unitdir}/sshd-keygen.target
      %attr(0644,root,root) %{_tmpfilesdir}/openssh.conf
    meta.description: |
      OpenSSH is a free version of SSH (Secure SHell), a program for logging
      into and executing commands on a remote machine. This package contains
      the secure shell daemon (sshd). The sshd daemon allows SSH clients to
      securely connect to your SSH server.
    meta.summary: An open source SSH server daemon
    requires:
    - openssh = %{version}-%{release}
    - pam >= 1.0.1-3
    - crypto-policies >= 20180306-1
    requiresPre:
    - shadow
    runtimePhase.post: |
      %systemd_post sshd.service sshd.socket
    runtimePhase.postun: |
      %systemd_postun_with_restart sshd.service
    runtimePhase.pre: |
      getent group sshd >/dev/null || groupadd -g %{sshd_uid} -r sshd || :
      getent passwd sshd >/dev/null || \
        useradd -c "Privilege-separated SSH" -u %{sshd_uid} -g sshd \
        -s /sbin/nologin -r -d /var/empty/sshd sshd 2> /dev/null || :
    runtimePhase.preun: |
      %systemd_preun sshd.service sshd.socket
  pam_ssh_agent_auth:
    files: |
      %license pam_ssh_agent_auth-pam_ssh_agent_auth-0.10.4/OPENSSH_LICENSE
      %attr(0755,root,root) %{_libdir}/security/pam_ssh_agent_auth.so
    meta.description: true
    meta.license: BSD
    meta.summary: PAM module for authentication with ssh-agent
    release:
    - 4.%{openssh_release}
    version: 0.10.4
version: null
