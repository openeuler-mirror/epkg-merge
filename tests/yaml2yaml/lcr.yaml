buildRequires:
- cmake gcc gcc-c++ git
- lxc >= %{lxcver}
- lxc-devel >= %{lxcver}
- zlib-devel yajl-devel gtest-devel
buildRoot:
- '%{_tmppath}/lcr-%{version}'
files: |
  %defattr(-,root,root,-)
  %{_libdir}/*
  %{_libdir}/pkgconfig/lcr.pc
group: Applications/System
meta.description: |
  Containers are insulated areas inside a system, which have their own namespace
  for filesystem, network, PID, IPC, CPU and memory allocation and which can be
  created using the Control Group and Namespace features included in the Linux
  kernel.

  This package provides the lightweight container tools and library to control
  lxc-based containers.
meta.homepage: https://gitee.com/openeuler/lcr
meta.license: LGPLv2.1+
meta.summary: Lightweight Container Runtime
name: lcr
patchset:
  '0': 0001-feat-Add-json-spec-for-rest-resize-api.patch
  '1': 0002-add-HAVE_ISULAD-definition-for-lxc-header.patch
  '2': 0003-fix-cpu-quota-out-of-range-when-update-to-1.patch
  '3': 0004-remove-unused-daemon-config-args.patch
  '4': 0005-refactor-handle-warnings.patch
phase.build: |+
  mkdir -p build
  cd build
  %cmake -DDEBUG=ON -DCMAKE_SKIP_RPATH=TRUE -DLIB_INSTALL_DIR=%{_libdir} ../
  %make_build

phase.clean: |+
  rm -rf %{buildroot}

phase.install: |+
  rm -rf %{buildroot}
  cd build
  mkdir -p %{buildroot}/{%{_libdir},%{_libdir}/pkgconfig,%{_includedir}/lcr,%{_bindir}}
  install -m 0644 ./src/liblcr.so            %{buildroot}/%{_libdir}/liblcr.so
  install -m 0644 ./conf/lcr.pc          %{buildroot}/%{_libdir}/pkgconfig/lcr.pc
  install -m 0644 ../src/lcrcontainer.h  %{buildroot}/%{_includedir}/lcr/lcrcontainer.h
  chmod +x %{buildroot}/%{_libdir}/liblcr.so

  install -m 0644 ./src/libisula_libutils.so        %{buildroot}/%{_libdir}/libisula_libutils.so
  install -d $RPM_BUILD_ROOT/%{_includedir}/%{_inner_name}
  install -m 0644 ../build/json/*.h  %{buildroot}/%{_includedir}/%{_inner_name}/
  install -m 0644 ../src/json/*.h  %{buildroot}/%{_includedir}/%{_inner_name}/
  install -m 0644 ../third_party/log.h  %{buildroot}/%{_includedir}/%{_inner_name}/log.h
  install -m 0644 ../third_party/go_crc64.h  %{buildroot}/%{_includedir}/%{_inner_name}/go_crc64.h
  chmod +x %{buildroot}/%{_libdir}/libisula_libutils.so

  find %{buildroot} -type f -name '*.la' -exec rm -f {} ';'
  find %{buildroot} -name '*.a' -exec rm -f {} ';'
  find %{buildroot} -name '*.cmake' -exec rm -f {} ';'

phase.prep: |+
  %autosetup -n lcr-v%{_version} -Sgit -p1

provides:
- liblcr.so()(64bit) %ifarch x86_64
- libisula_libutils.so()(64bit) %ifarch x86_64
- liblcr.so()(64bit) %ifarch aarch64
- libisula_libutils.so()(64bit) %ifarch aarch64
release: '%{_release}'
requires:
- lxc >= %{lxcver} yajl zlib
rpmMacros:
- '%global _version 2.0.8'
- '%global _release 5'
- '%global _inner_name isula_libutils'
- '%define lxcver 4.0.3-2021112501'
runtimePhase.pre: |2+

source:
  '0': https://gitee.com/openeuler/lcr/repository/archive/v%{version}.tar.gz
subpackage:
  lcr-devel:
    exclusiveArch:
    - x86_64 aarch64
    files: |
      %defattr(-,root,root,-)
      %{_includedir}/lcr/lcrcontainer.h
      %{_includedir}/%{_inner_name}/*.h
    group: Libraries
    meta.description: the %{name}-libs package contains libraries for running iSula
      applications.
    meta.summary: Huawei container runtime, json and log C Library
    requires:
    - '%{name} = %{version}-%{release}'
version: null
