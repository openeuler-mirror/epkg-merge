buildRequires:
- gcc swig libtool systemd kernel-headers >= 2.6.29
- openldap-devel krb5-devel libcap-ng-devel
- golang %ifarch %{golang_arches}
epoch: 1
files: |
  %doc README
  %{!?_licensedir:%global license None
  %license COPYING lgpl-2.1.txt
  %attr(755,root,root) /sbin/auditctl
  %attr(755,root,root) /sbin/auditd
  %attr(755,root,root) /sbin/ausearch
  %attr(755,root,root) /sbin/aureport
  %attr(750,root,root) /sbin/autrace
  %attr(755,root,root) /sbin/augenrules
  %attr(755,root,root) %{_bindir}/aulast
  %attr(755,root,root) %{_bindir}/aulastlog
  %attr(755,root,root) %{_bindir}/ausyscall
  %attr(755,root,root) %{_bindir}/auvirt
  %attr(644,root,root) %{_unitdir}/auditd.service
  %attr(750,root,root) %dir %{_libexecdir}/initscripts/legacy-actions/auditd
  %attr(750,root,root) %{_libexecdir}/initscripts/legacy-actions/auditd/condrestart
  %attr(750,root,root) %{_libexecdir}/initscripts/legacy-actions/auditd/reload
  %attr(750,root,root) %{_libexecdir}/initscripts/legacy-actions/auditd/restart
  %attr(750,root,root) %{_libexecdir}/initscripts/legacy-actions/auditd/resume
  %attr(750,root,root) %{_libexecdir}/initscripts/legacy-actions/auditd/rotate
  %attr(750,root,root) %{_libexecdir}/initscripts/legacy-actions/auditd/state
  %attr(750,root,root) %{_libexecdir}/initscripts/legacy-actions/auditd/stop
  %ghost %{_localstatedir}/run/auditd.state
  %attr(750,root,root) %dir %{_var}/log/audit
  %attr(750,root,root) %dir /etc/audit
  %attr(750,root,root) %dir /etc/audit/rules.d
  %attr(750,root,root) %dir /etc/audit/plugins.d
  %config(noreplace) %attr(640,root,root) /etc/audit/auditd.conf
  %ghost %config(noreplace) %attr(600,root,root) /etc/audit/rules.d/audit.rules
  %ghost %config(noreplace) %attr(640,root,root) /etc/audit/audit.rules
  %config(noreplace) %attr(640,root,root) /etc/audit/audit-stop.rules
  %config(noreplace) %attr(640,root,root) /etc/audit/plugins.d/af_unix.conf
meta.description: |
  The audit package contains the user space utilities for storing and searching
  the audit records generated by the audit subsystem in the Linux 2.6 and later
  kernels.
meta.homepage: https://people.redhat.com/sgrubb/audit/
meta.license: GPLv2+ and LGPLv2+
meta.summary: User space tools for kernel auditing
name: audit
patchset:
  '0': bugfix-audit-support-armv7b.patch
  '1': bugfix-audit-userspace-missing-syscalls-for-aarm64.patch
  '10': backport-Move-the-free_config-to-success-path.patch
  '11': backport-Check-for-fuzzer-induced-invalid-value.patch
  '12': backport-error-out-if-log-is-mangled.patch
  '13': backport-Dont-run-off-the-end-with-corrupt-logs.patch
  '14': backport-Another-hardening-measure-for-corrupted-logs.patch
  '15': backport-Fix-busy-loop-in-normalizer-when-logs-are-corrupt.patch
  '16': backport-Better-fix-for-busy-loop-in-normalizer-when-logs-are.patch
  '17': backport-flush-uid-gid-caches-when-user-group-added-deleted-m.patch
  '18': backport-In-auditd-check-if-log_file-is-valid-before-closing-.patch
  '19': backport-Check-ctime-return-code.patch
  '2': bugfix-audit-reload-coredump.patch
  '20': backport-When-interpreting-if-val-is-NULL-return-an-empty-str.patch
  '21': backport-auditd.service-Restart-on-failure-ignoring-some-exit.patch
  '22': backport-0001-In-auditd-close-the-logging-file-descriptor-when-log.patch
  '23': backport-0002-In-auditd-close-the-logging-file-descriptor-when-log.patch
  '3': backport-Fix-the-default-location-for-zos-remote.conf-171.patch
  '4': backport-Add-missing-call-to-free_interpretation_list.patch
  '5': backport-fix-2-more-issues-found-by-fuzzing.patch
  '6': backport-Fix-an-auparse-memory-leak-caused-in-recent-glibc.patch
  '7': backport-Fix-double-free-with-corrupted-logs.patch
  '8': backport-Fix-the-closing-timing-of-audit_fd-166.patch
  '9': backport-Fix-some-string-length-issues.patch
phase.build: |+
  %configure --with-python=no \
  --with-python3=yes \
  --enable-gssapi-krb5=yes \
  --with-arm \
  --with-aarch64 \
  --with-libcap-ng=yes \
  --enable-zos-remote \
  --enable-systemd --sbindir=/sbin --libdir=/%{_lib} \
  %ifarch %{golang_arches}
  --with-golang \
  %endif

  make CFLAGS="%{optflags}" %{?_smp_mflags}

phase.check: |+
  %ifarch %{golang_arches}
  make check
  %endif
  rm -f rules/Makefile*

phase.install: |+
  mkdir -p $RPM_BUILD_ROOT/{sbin,etc/audit/plugins.d,etc/audit/rules.d}
  mkdir -p $RPM_BUILD_ROOT/%{_mandir}/{man5,man8}
  mkdir -p $RPM_BUILD_ROOT/%{_lib}
  mkdir -p $RPM_BUILD_ROOT/%{_libdir}/audit
  mkdir -p --mode=0700 $RPM_BUILD_ROOT/%{_var}/log/audit
  mkdir -p $RPM_BUILD_ROOT/%{_var}/spool/audit
  make DESTDIR=$RPM_BUILD_ROOT install

  mkdir -p $RPM_BUILD_ROOT/%{_libdir}
  mv $RPM_BUILD_ROOT/%{_lib}/libaudit.a $RPM_BUILD_ROOT%{_libdir}
  mv $RPM_BUILD_ROOT/%{_lib}/libauparse.a $RPM_BUILD_ROOT%{_libdir}
  curdir=`pwd`
  cd $RPM_BUILD_ROOT/%{_libdir}
  LIBNAME=`basename \`ls $RPM_BUILD_ROOT/%{_lib}/libaudit.so.1.*.*\``
  ln -s ../../%{_lib}/$LIBNAME libaudit.so
  LIBNAME=`basename \`ls $RPM_BUILD_ROOT/%{_lib}/libauparse.so.0.*.*\``
  ln -s ../../%{_lib}/$LIBNAME libauparse.so
  cd $curdir
  rm -f $RPM_BUILD_ROOT/%{_lib}/libaudit.so
  rm -f $RPM_BUILD_ROOT/%{_lib}/libauparse.so

  find $RPM_BUILD_ROOT/%{_libdir}/python%{python3_version}/site-packages -name '*.a' -delete

  mv $RPM_BUILD_ROOT/%{_lib}/pkgconfig $RPM_BUILD_ROOT%{_libdir}

  touch -r ./audit.spec $RPM_BUILD_ROOT/etc/libaudit.conf
  touch -r ./audit.spec $RPM_BUILD_ROOT/usr/share/man/man5/libaudit.conf.5.gz

  %delete_la

phase.prep: |+
  %autosetup -n %{name}-%{version} -p1
  cp %{SOURCE1} .
  autoreconf -f -i

release: 2
requires:
- '%{name}-libs = %{epoch}:%{version}-%{release}'
requiresPost:
- systemd coreutils
requiresPostUn:
- systemd coreutils
requiresPreUn:
- systemd
runtimePhase.post: |+
  /sbin/ldconfig
  files=`ls /etc/audit/rules.d/ 2>/dev/null | wc -w`
  if [ "$files" -eq 0 ] ; then
  if [ -e /usr/share/doc/audit/rules/10-no-audit.rules ] ; then
  cp /usr/share/doc/audit/rules/10-no-audit.rules /etc/audit/rules.d/audit.rules
  else
  touch /etc/audit/rules.d/audit.rules
  fi
  chmod 0600 /etc/audit/rules.d/audit.rules
  fi
  if [ -d "/etc/audisp/" ];then
  if [ -s "/etc/audisp/plugins.d/af_unix.conf" ];then
  diffrence=`diff /etc/audisp/plugins.d/af_unix.conf /etc/audit/plugins.d/af_unix.conf`
  if [ "X$diffrence" != "X" ];then
  cp /etc/audisp/plugins.d/af_unix.conf /etc/audit/plugins.d/af_unix.conf
  fi
  fi
  fi
  %systemd_post auditd.service

runtimePhase.postun: |+
  /sbin/ldconfig
  if [ $1 -ge 1 ]; then
  /sbin/service auditd condrestart > /dev/null 2>&1 || :
  fi

runtimePhase.pre: |+
  if [ -d "/etc/audisp/" ];then
  self_config_files_285=(syslog.conf au-remote.conf audispd-zos-remote.conf af_unix.conf)
  plugins_config_files=`ls /etc/audisp/plugins.d/*.conf 2>/dev/null | wc -w`
  if [ $plugins_config_files -gt 0 ];then
  if [ ! -d /etc/audit/plugins.d/ ];then
  mkdir -p /etc/audit/plugins.d/
  fi

  for file in `/usr/bin/ls /etc/audisp/plugins.d/*.conf`
  do
  if [[ " ${self_config_files_285} " =~ " `/usr/bin/basename $file` " ]];then
  continue
  else
  if [ ! -f /etc/audit/plugins.d/`/usr/bin/basename $file` ];then
  cp $file /etc/audit/plugins.d/
  fi
  fi
  done
  fi
  fi

runtimePhase.preun: |+
  if [ $1 -eq 0 ] && [ -x /usr/bin/systemctl ]; then
  /usr/bin/systemctl --no-reload disable auditd.service || :
  fi
  if [ $1 -eq 0 ]; then
  /sbin/service auditd stop > /dev/null 2>&1
  fi

source:
  '0': https://people.redhat.com/sgrubb/audit/%{name}-%{version}.tar.gz
  '1': https://www.gnu.org/licenses/lgpl-2.1.txt
subpackage:
  audispd-plugins:
    files: |
      %config(noreplace) %attr(640,root,root) /etc/audit/audisp-remote.conf
      %config(noreplace) %attr(640,root,root) /etc/audit/plugins.d/au-remote.conf
      %config(noreplace) %attr(640,root,root) /etc/audit/plugins.d/syslog.conf
      %attr(750,root,root) /sbin/audisp-remote
      %attr(750,root,root) /sbin/audisp-syslog
      %attr(700,root,root) %dir %{_var}/spool/audit
    meta.description: This package provides plugins for the real-time interface to
      audispd.
    meta.license: GPLv2+
    meta.summary: Plugins for audit event dispatcher
    requires:
    - '%{name} = %{epoch}:%{version}-%{release}'
    - '%{name}-libs = %{epoch}:%{version}-%{release}'
    runtimePhase.post: |
      if [ -d "/etc/audisp/" ];then
      for file in audisp-remote.conf au-remote.conf syslog.conf
      do
      if [ "$file" == "audisp-remote.conf" ];then
      if [ -s "/etc/audisp/$file" ];then
      diffrence=`diff /etc/audisp/$file /etc/audit/$file`
      if [ "X$diffrence" != "X" ];then
      cp /etc/audisp/$file /etc/audit/$file
      if [ "X`grep startup_failure_action /etc/audit/$file`" == "X" ];then
      echo "startup_failure_action = warn_once_continue" >> /etc/audit/$file
      fi
      fi
      fi
      elif [ "$file" == "syslog.conf" ];then
      if [ -s "/etc/audisp/plugins.d/$file" ];then
      diffrence=`diff /etc/audisp/plugins.d/$file /etc/audit/plugins.d/$file`
      if [ "X$diffrence" != "X" ];then
      cp /etc/audisp/plugins.d/syslog.conf /etc/audit/plugins.d/syslog.conf
      sed -i 's/path[ ]*=[ ]*builtin_syslog/path\ =\ \/sbin\/audisp-syslog/g' /etc/audit/plugins.d/syslog.conf
      sed -i 's/type[ ]*=[ ]*builtin/type\ =\ always/g' /etc/audit/plugins.d/syslog.conf
      fi
      fi
      else
      if [ -s "/etc/audisp/plugins.d/$file" ];then
      diffrence=`diff /etc/audisp/plugins.d/$file /etc/audit/plugins.d/$file`
      if [ "X$diffrence" != "X" ];then
      cp /etc/audisp/plugins.d/$file /etc/audit/plugins.d/$file
      fi
      fi
      fi
      done
      fi
  audispd-plugins-zos:
    files: |
      %config(noreplace) %attr(640,root,root) /etc/audit/plugins.d/audispd-zos-remote.conf
      %config(noreplace) %attr(640,root,root) /etc/audit/zos-remote.conf
      %attr(750,root,root) /sbin/audispd-zos-remote
    meta.description: |
      This package provides a z/OS plugin for audit event dispatcher that
      will forward audit events to a configured z/OS service management facility
      database.
    meta.license: GPLv2+
    meta.summary: z/OS plugin for audit event dispatcher
    requires:
    - '%{name} = %{epoch}:%{version}-%{release}'
    - '%{name}-libs = %{epoch}:%{version}-%{release}'
    - openldap
    runtimePhase.post: |
      if [ -d "/etc/audisp/" ];then
      for file in audispd-zos-remote.conf zos-remote.conf
      do
      if [ "$file" == "zos-remote.conf" ];then
      if [ -s "/etc/audisp/$file" ];then
      diffrence=`diff /etc/audisp/$file /etc/audit/$file`
      if [ "X$diffrence" != "X" ];then
      cp /etc/audisp/$file /etc/audit/$file
      fi
      fi
      elif [ "$file" == "audispd-zos-remote.conf" ];then
      if [ -s "/etc/audisp/plugins.d/$file" ];then
      diffrence=`diff /etc/audisp/plugins.d/$file /etc/audit/plugins.d/$file`
      if [ "X$diffrence" != "X" ];then
      cp /etc/audisp/plugins.d/$file /etc/audit/plugins.d/$file
      sed -i 's/\/etc\/audisp\/zos-remote\.conf/\/etc\/audit\/zos-remote\.conf/g' /etc/audit/plugins.d/$file
      fi
      fi
      fi
      done
      fi
  audit-devel:
    files: |
      %defattr(-,root,root)
      %doc contrib/plugin
      %{!?_licensedir:%global license None
      %license lgpl-2.1.txt
      %{_libdir}/libaudit.so
      %{_libdir}/libauparse.so
      %ifarch %{golang_arches}
      %dir %{_prefix}/lib/golang/src/pkg/redhat.com/audit
      %{_prefix}/lib/golang/src/pkg/redhat.com/audit/audit.go
      %endif
      %{_includedir}/libaudit.h
      %{_includedir}/auparse.h
      %{_includedir}/auparse-defs.h
      %{_datadir}/aclocal/audit.m4
      %{_libdir}/pkgconfig/audit.pc
      %{_libdir}/pkgconfig/auparse.pc
      %{_libdir}/libaudit.a
      %{_libdir}/libauparse.a
    meta.description: |
      The audit-libs-devel package contains the header files needed for developing
      applications that need to use the audit framework libraries.
    meta.license: LGPLv2+
    meta.summary: Header files for libaudit
    provides:
    - audit-libs-devel audit-libs-static
    requires:
    - '%{name}%{?_isa} = %{epoch}:%{version}-%{release}'
    - kernel-headers >= 2.6.29
  audit-help:
    buildArch: noarch
    files: |
      %defattr(-,root,root)
      %doc ChangeLog rules init.d/auditd.cron
      %attr(644,root,root) %{_datadir}/%{name}/sample-rules/*
      %attr(644,root,root) %{_mandir}/man3/*.3.gz
      %attr(644,root,root) %{_mandir}/man5/*.5.gz
      %attr(644,root,root) %{_mandir}/man7/*.7.gz
      %attr(644,root,root) %{_mandir}/man8/*.8.gz
    meta.description: Man pages and other related documents for %{name}.
    meta.summary: Documents for %{name}
    requires:
    - man info
  audit-libs:
    files: |
      /%{_lib}/libaudit.so.1*
      /%{_lib}/libauparse.*
      %config(noreplace) %attr(640,root,root) /etc/libaudit.conf
    meta.description: |
      The audit-libs package contains the dynamic libraries needed for
      applications to use the audit framework.
    meta.license: LGPLv2+
    meta.summary: Dynamic library for libaudit
  python3-audit:
    buildRequires:
    - python3-devel
    files: |
      %attr(755,root,root) %{python3_sitearch}/*
    meta.description: |
      The python3-audit package contains the bindings so that libaudit and
      libauparse can be used by python3.
    meta.license: LGPLv2+
    meta.summary: Python3 bindings for libaudit
    obsoletes:
    - audit-libs-python3 < %{version}-%{release}
    provides:
    - audit-libs-python3 = %{version}-%{release}
    - audit-libs-python3%{?_isa} = %{version}-%{release}
    requires:
    - '%{name}%{?_isa} = %{epoch}:%{version}-%{release}'
version: 3.0.1
