buildRequires:
- cmake openssl-devel zlib-devel libev-devel gcc gcc-c++
files: |
  %defattr(-,root,root)
  %license LICENSE
  %{_libdir}/%{name}.so.*
meta.description: |
  Libwebsockets (LWS) is a flexible, lightweight pure C library for implementing modern
  network protocols easily with a tiny footprint, using a nonblocking event loop.
meta.homepage: https://libwebsockets.org
meta.license: LGPLv2 and Public Domain and BSD and MIT and zlib
meta.summary: A lightweight C library for Websockets
name: libwebsockets
patchset:
  '0': 0001-add-secure-compile-option-in-Makefile.patch
  '1': 0002-solve-the-BEP-problem.patch
  '2': 0003-route-extend-lws_route_uidx_t-from-1-byte-to-2-bytes.patch
phase.build: |+
  mkdir -p build
  cd build
  %cmake \
      -D LWS_WITH_HTTP2=ON \
      -D LWS_IPV6=ON \
      -D LWS_WITH_ZIP_FOPS=ON \
      -D LWS_WITH_SOCKS5=ON \
      -D LWS_WITH_RANGES=ON \
      -D LWS_WITH_ACME=ON \
      -D LWS_WITH_LIBUV=OFF \
      -D LWS_WITH_LIBEV=OFF \
      -D LWS_WITH_LIBEVENT=OFF \
      -D LWS_WITH_FTS=ON \
      -D LWS_WITH_THREADPOOL=ON \
      -D LWS_UNIX_SOCK=ON \
      -D LWS_WITH_HTTP_PROXY=ON \
      -D LWS_WITH_DISKCACHE=ON \
      -D LWS_WITH_LWSAC=ON \
      -D LWS_LINK_TESTAPPS_DYNAMIC=ON \
      -D LWS_WITHOUT_BUILTIN_GETIFADDRS=ON \
      -D LWS_USE_BUNDLED_ZLIB=OFF \
      -D LWS_WITHOUT_BUILTIN_SHA1=ON \
      -D LWS_WITH_STATIC=OFF \
      -D LWS_WITHOUT_CLIENT=OFF \
      -D LWS_WITHOUT_SERVER=OFF \
      -D LWS_WITHOUT_TESTAPPS=OFF \
      -D LWS_WITHOUT_TEST_SERVER=ON \
      -D LWS_WITHOUT_TEST_SERVER_EXTPOLL=ON \
      -D LWS_WITHOUT_TEST_PING=ON \
      -D LWS_WITHOUT_TEST_CLIENT=ON \
      -D LWS_WITHOUT_EXTENSIONS=OFF \
      ..

  %make_build

phase.install: |+
  cd build
  %make_install

  %delete_la_and_a
  find %{buildroot} -name '*.cmake' -exec rm -f {} ';'
  find %{buildroot} -name '*_static.pc' -exec rm -f {} ';'

  %ldconfig_scriptlets

phase.prep: |
  %autosetup -n %{name}-%{version} -p1
provides:
- bundled(sha1-hollerbach) bundled(base64-decode) bundled(ssl-http2)
release: 4
source:
  '0': https://github.com/warmcat/libwebsockets/archive/v%{version}.tar.gz#/%{name}-%{version}.tar.gz
subpackage:
  libwebsockets-devel:
    files: |
      %defattr(-,root,root)
      %{_includedir}/*.h
      %{_includedir}/%{name}
      %{_libdir}/*.so
      %{_libdir}/pkgconfig/*.pc
      %{_bindir}/%{name}-test-*
      %{_datadir}/%{name}-test-server/
    meta.description: |
      This package contains the header files needed for developing
      %{name} applications.
    meta.summary: Headers for developing programs that will use %{name}
    obsoletes:
    - '%{name}-tests'
    provides:
    - '%{name}-tests'
    requires:
    - '%{name}%{?_isa} = %{version}-%{release}'
  libwebsockets-help:
    buildArch: noarch
    files: |
      %defattr(-,root,root)
      %doc changelog README.md READMEs/
    meta.description: Man pages and other related documents for %{name}.
    meta.summary: Documents for %{name}
    requires:
    - man info
version: 4.3.0
