buildRequires:
- automake autoconf libtool systemd-devel
- libtirpc-devel quota-devel systemd
conflicts:
- man-pages < 2.43-12
files: |
  %defattr(-,root,root)
  %config(noreplace) /etc/sysconfig/%{name}
  %doc AUTHORS
  %license COPYING
  %{_sbindir}/*
  %{_bindir}/*
  %{_unitdir}/%{name}.*
  %{_tmpfilesdir}/%{name}.conf
  %attr(0700, %{rpcbind_user_group}, %{rpcbind_user_group}) %dir %{rpcbind_state_dir}
meta.description: |
  The %{name} utility is a server that converts RPC program
  numbers into universal addresses. It must be running on the
  host to be able to make RPC calls on a server on that machine.
meta.homepage: https://nfsv4.bullopensource.org
meta.license: BSD
meta.summary: Universal addresses to RPC program number mapper
name: rpcbind
obsoletes:
- portmap <= 4.0-65.3
patchset:
  '0': '%{name}-0.2.3-systemd-envfile.patch'
  '1': '%{name}-0.2.3-systemd-tmpfiles.patch'
  '2': '%{name}-0.2.4-runstatdir.patch'
  '3': '%{name}-0.2.4-systemd-service.patch'
  '4': '%{name}-0.2.4-systemd-rundir.patch'
  '5': bugfix-rpcbind-GETADDR-return-client-ip.patch
  '6': CVE-2017-8779.patch
  '7': backport-fix-double-free-in-init_transport.patch
  '8': backport-debian-enable-rmt-calls-with-r.patch
  '9': bugfix-listen-tcp-port-111.patch
phase.build: |+
  autoreconf -fisv
  %configure --sbindir=%{_bindir} --enable-warmstarts \
  --with-statedir="%rpcbind_state_dir" \
  --with-rpcuser="%rpcbind_user_group" \
  --with-nss-modules="files altfiles" \
  --enable-debug --enable-rmtcalls \


  make all

phase.install: |+
  install -m 0755 -d %{buildroot}{%{_sbindir},%{_bindir},/etc/sysconfig}
  install -m 0755 -d %{buildroot}%{_unitdir}
  install -m 0755 -d %{buildroot}%{_tmpfilesdir}
  install -m 0755 -d %{buildroot}%{_mandir}/man8
  install -m 0755 -d %{buildroot}%{rpcbind_state_dir}
  %make_install
  make DESTDIR=$RPM_BUILD_ROOT install

  install -m 644 %{SOURCE1} %{buildroot}/etc/sysconfig/%{name}

  cd %{buildroot}%{_sbindir}
  ln -sf ../bin/%{name}
  ln -sf ../bin/rpcinfo

phase.prep: |+
  %autosetup -n %{name}-%{version} -p1

provides:
- portmap = %{version}-%{release}
release: 4
requires:
- glibc-common setup
requiresPost:
- chkconfig systemd
requiresPostUn:
- systemd coreutils
requiresPre:
- coreutils shadow-utils
requiresPreUn:
- systemd
rpmMacros:
- '%global rpcbind_user_group rpc'
- '%global rpcbind_state_dir %{_rundir}/rpcbind'
runtimePhase.post: |+
  %systemd_post %{name}.service %{name}.socket

runtimePhase.postun: |+
  %systemd_postun_with_restart %{name}.service %{name}.socket

  %triggerun -- %{name} < 0.2.0-15
  %{_bindir}/systemd-sysv-convert --save %{name} >/dev/null 2>&1 ||:
  /bin/systemctl --no-reload enable %{name}.service >/dev/null 2>&1
  /sbin/chkconfig --del %{name} >/dev/null 2>&1 || :
  /bin/systemctl try-restart %{name}.service >/dev/null 2>&1 || :

  %triggerin -- %{name} > 0.2.2-2.0
  if systemctl -q is-enabled %{name}.socket
  then
  /bin/systemctl reenable %{name}.socket  >/dev/null 2>&1 || :
  /bin/systemctl restart %{name}.socket >/dev/null 2>&1 || :
  fi

runtimePhase.pre: "getent group rpc >/dev/null || groupadd -f -g 32 -r rpc\nif ! getent\
  \ passwd rpc >/dev/null ; then\nif ! getent passwd 32 >/dev/null ; then\nuseradd\
  \ -l -c \"Rpcbind Daemon\" -d /var/lib/%{name}  \\\n\t      -g rpc -M -s /sbin/nologin\
  \ -o -u 32 rpc > /dev/null 2>&1\nelse\nuseradd -l -c \"Rpcbind Daemon\" -d /var/lib/%{name}\
  \  \\\n\t      -g rpc -M -s /sbin/nologin rpc > /dev/null 2>&1\nfi\nfi\n\n"
runtimePhase.preun: |+
  %systemd_preun %{name}.service %{name}.socket

source:
  '0': https://downloads.sourceforge.net/%{name}/%{name}-%{version}.tar.bz2
  '1': '%{name}.sysconfig'
subpackage:
  rpcbind-help:
    buildArch: noarch
    files: |
      %defattr(-,root,root)
      %doc ChangeLog README
      %{_mandir}/man8/*.8.gz
    meta.description: Man pages and other related documents for %{name}.
    meta.summary: Documents for %{name}
    requires:
    - man info
version: 1.2.6
