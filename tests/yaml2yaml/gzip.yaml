buildRequires:
- gcc texinfo less autoconf automake
conflicts:
- filesystem < 3
files: |
  %defattr(-,root,root)
  %doc AUTHORS ChangeLog README
  %license COPYING
  %{_bindir}/*
  %{profiledir}/*
  %exclude %{_infodir}/dir
meta.description: |
  gzip is a single-file/stream lossless data compression
  utility, where the resulting compressed file generally
  has the suffix .gz.
meta.homepage: https://www.gnu.org/software/gzip
meta.license: GPLv3
meta.summary: A data compression utility
name: gzip
patchset:
  '0': backport-gzip-detect-invalid-input.patch
  '1': backport-gzip-test-invalid-input-bug.patch
  '2': fix-verbose-disable.patch
  '3': performance-neoncrc32-and-prfm.patch
phase.build: |+
  %ifarch aarch64
  export CFLAGS="${CFLAGS:-%optflags} -march=armv8-a+crc"
  %endif
  autoreconf
  %configure
  %make_build

phase.check: |+
  make check

phase.install: |+
  rm -rf %RPM_BUILD_ROOT
  %make_install
  rm -f %{buildroot}%{_bindir}/uncompress

  %global profiledir %{_sysconfdir}/profile.d
  mkdir -p %{buildroot}%{profiledir}
  install -p -m 644 %{SOURCE1} %{buildroot}%{profiledir}
  install -p -m 644 %{SOURCE2} %{buildroot}%{profiledir}

phase.prep: |+
  %autosetup -n %{name}-%{version} -p1

provides:
- /bin/gunzip
- /bin/gzip
- /bin/zcat
- bundled(gnulib)
release: 3
requires:
- coreutils
source:
  '0': https://ftp.gnu.org/gnu/gzip/gzip-%{version}.tar.xz
  '1': colorzgrep.csh
  '2': colorzgrep.sh
subpackage:
  gzip-help:
    buildArch: noarch
    files: |
      %doc NEWS TODO THANKS
      %{_infodir}/*info*
      %{_mandir}/man1/*
    meta.description: Man pages and other related documents for %{name}.
    meta.summary: Documents for %{name}
    requires:
    - man info
version: 1.12
