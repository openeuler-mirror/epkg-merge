buildRequires:
- gcc doxygen openssl-devel
files: |
  %doc ChangeLog
  %license LICENSE
  %{_libdir}/libevent-2.1.so.*
  %{_libdir}/libevent_core-2.1.so.*
  %{_libdir}/libevent_extra-2.1.so.*
  %{_libdir}/libevent_openssl-2.1.so.*
  %{_libdir}/libevent_pthreads-2.1.so.*
meta.description: |
  Libevent additionally provides a sophisticated framework for buffered network IO, with support for sockets,
  filters, rate-limiting, SSL, zero-copy file transmission, and IOCP.
  Libevent includes support for several useful protocols, including DNS, HTTP, and a minimal RPC framewor.
meta.homepage: http://libevent.org/
meta.license: BSD
meta.summary: An event notification library
name: libevent
patchset:
  '0': libevent-nonettests.patch
  '1': http-add-callback-to-allow-server-to-decline-and-the.patch
  '2': add-testcases-for-event.c-apis.patch
  '3': 0001-Revert-Fix-checking-return-value-of-the-evdns_base_r.patch
phase.build: |+
  %configure --disable-dependency-tracking \
  --disable-static
  %make_build

phase.check: |+
  %make_build check

  %ldconfig_scriptlets

phase.install: |+
  %make_install
  rm -f %{buildroot}%{_libdir}/*.la

phase.prep: |+
  %autosetup -n libevent-%{version}-stable -p1

release: 6
source:
  '0': https://github.com/libevent/libevent/releases/download/release-%{version}-stable/libevent-%{version}-stable.tar.gz
subpackage:
  libevent-devel:
    files: |
      %{_includedir}/*.h
      %dir %{_includedir}/event2
      %{_includedir}/event2/*.h
      %{_libdir}/libevent.so
      %{_libdir}/libevent_core.so
      %{_libdir}/libevent_extra.so
      %{_libdir}/libevent_openssl.so
      %{_libdir}/libevent_pthreads.so
      %{_libdir}/pkgconfig/libevent.pc
      %{_libdir}/pkgconfig/libevent_core.pc
      %{_libdir}/pkgconfig/libevent_extra.pc
      %{_libdir}/pkgconfig/libevent_openssl.pc
      %{_libdir}/pkgconfig/libevent_pthreads.pc
      %{_bindir}/event_rpcgen.*
    meta.description: |
      This package contains the header files and libraries for developing
      with %{name}.
    meta.summary: Development files for %{name}
    requires:
    - '%{name} = %{version}-%{release}'
version: 2.1.12
